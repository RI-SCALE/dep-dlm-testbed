repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        description: Validates k8s manifests, compose files, and storm configs.
        args: [--allow-multiple-documents]
        exclude: ^deploy/helm-charts/.*/templates/.*$
      - id: check-json
        description: Validates realm.json and idpsecrets.json.
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
        files: ^shared/scripts/.*\.sh$
      - id: check-symlinks          # catches broken symlinks in files/
      - id: destroyed-symlinks      # catches symlinks turned into files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        args: [ --fix ]
        exclude: ^shared/patches/.*\.py$
      - id: ruff-format

  - repo: local
    hooks:
      - id: helm-dependency-build
        name: helm dependency build (umbrella chart)
        description: rucio-server/rucio-daemons resolve via git+https through
          the helm-git plugin — helmlint needs charts/ populated first, or it
          silently skips/misreports the umbrella chart.
        entry: bash -c 'helm dependency build deploy/helm-charts/dep-dlm-testbed'
        language: system
        files: ^deploy/helm-charts/dep-dlm-testbed/Chart\.(yaml|lock)$
        pass_filenames: false

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.24
    hooks:
      - id: helmlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^shared/scripts/.*\.sh$
        exclude: ^shared/scripts/fts/wait-for-it\.sh$

  - repo: local
    hooks:
      - id: tf-fmt-check
        name: terraform fmt (check only)
        entry: make tf-fmt-check
        language: system
        files: \.tf$
        pass_filenames: false
      - id: tf-lint
        name: terraform lint
        entry: make tf-lint
        language: system
        files: \.tf$
        pass_filenames: false
