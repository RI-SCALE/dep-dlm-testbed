name: Terraform teardown (staging)

# Manual-only, on purpose — this is the one place bucket/state DELETION
# lives, deliberately kept out of terraform-staging.yml so a normal
# push/PR can never trigger it. Requires typing the environment name
# exactly, on top of GitHub's own environment approval gate.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm you want to destroy the staging environment'
        required: true
      delete_state_bucket:
        description: 'Also delete the GCS state bucket after destroy? (Terraform loses all memory of this environment — only do this when tearing down for good, not for routine cleanup)'
        type: boolean
        default: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: staging
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest
    environment: staging # same GitHub Environment as apply — same reviewers, same gate
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "staging" ]; then
            echo "Confirmation input did not match 'staging' — aborting." >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1006752094222/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: dep-dlm-terraform-ci@project-725bc3b5-635b-4922-bb9.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: google-github-actions/setup-gcloud@v2

      - name: make tf-init
        run: make tf-init

      # Real resources go first, always — the bucket is state, not
      # infrastructure. Deleting it before this would leave every GCP
      # resource orphaned with no Terraform record of them.
      - name: make tf-destroy
        run: make tf-destroy AUTO_APPROVE=1

      # Only reached if tf-destroy above succeeded AND the input was
      # explicitly opted into — deletes the state history itself, so
      # this environment can no longer be managed by Terraform at all
      # afterward without starting over from a fresh tf-init.
      - name: make tf-destroy-state-bucket
        if: github.event.inputs.delete_state_bucket == 'true'
        run: make tf-destroy-state-bucket
