name: _terraform-destroy

on:
  workflow_call:
    inputs:
      tf_env:
        description: "Environment directory name under deploy/terraform/environments/ (e.g. staging, production)"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment to resolve vars from and gate destroy behind (usually the same as tf_env)"
        required: true
        type: string
      confirm:
        description: "Value the human typed in the calling workflow's confirmation input — must exactly equal environment_name"
        required: true
        type: string

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.tf_env }}
  # destroy only needs Terraform's variable graph to resolve, not the
  # real OIDC identity — these values never affect resource addresses,
  # only rendered secret payload content, which destroy doesn't diff.
  OIDC_CLIENT_ID: "unused-for-destroy"
  OIDC_CLIENT_SECRET: "unused-for-destroy"

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }} # same GitHub Environment as apply — same reviewers, same gate
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment_name }}" ]; then
            echo "Confirmation input '${{ inputs.confirm }}' did not match '${{ inputs.environment_name }}' — aborting." >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Generate certificates
        run: make certs

      - name: make tf-init
        run: make tf-init

      - name: make tf-destroy
        run: make tf-destroy AUTO_APPROVE=1
