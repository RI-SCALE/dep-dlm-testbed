name: Deploy (production)

on:
  workflow_dispatch:
    inputs:
      scope_profile:
        description: "OIDC scope profile"
        required: true
        type: choice
        options: [egi-dev, ls-aai-dev]
        default: egi-dev
      token_mode:
        description: "Token exchange mode"
        required: true
        type: choice
        options: [managed, unmanaged]
        default: unmanaged
      gitops_engine:
        description: "GitOps engine to install (only used if run_gitops is checked)"
        required: true
        type: choice
        options: [argocd, flux]
        default: argocd
      run_terraform:
        description: "Run terraform plan/apply + infra smoke test"
        required: true
        type: boolean
        default: true
      run_gitops:
        description: "Install GitOps engine + full smoke test (requires an already-applied environment, either from this run or a prior one)"
        required: true
        type: boolean
        default: false
      # No run_e2e here — validation-storage (and the
      # e2e transfer test suite that depends on it) is staging-only for now

permissions:
  id-token: write
  contents: read
  actions: write
  pull-requests: write

jobs:
  terraform:
    if: inputs.run_terraform
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      tf_env: production
      environment_name: production
      token_mode: ${{ inputs.token_mode }}
      scope_profile: ${{ inputs.scope_profile }}
    secrets:
      OIDC_CLIENT_ID: ${{ inputs.scope_profile == 'ls-aai-dev' && secrets.LS_AAI_DEV_OIDC_CLIENT_ID || secrets.EGI_DEV_OIDC_CLIENT_ID }}
      OIDC_CLIENT_SECRET: ${{ inputs.scope_profile == 'ls-aai-dev' && secrets.LS_AAI_DEV_OIDC_CLIENT_SECRET || secrets.EGI_DEV_OIDC_CLIENT_SECRET }}

  gitops:
    needs: terraform
    if: |
      always() &&
      inputs.run_gitops &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    uses: ./.github/workflows/_gitops-deploy.yml
    with:
      tf_env: production
      environment_name: production
      gitops_engine: ${{ inputs.gitops_engine }}
      token_mode: ${{ inputs.token_mode }}
      scope_profile: ${{ inputs.scope_profile }}
    secrets:
      OIDC_CLIENT_ID: ${{ inputs.scope_profile == 'ls-aai-dev' && secrets.LS_AAI_DEV_OIDC_CLIENT_ID || secrets.EGI_DEV_OIDC_CLIENT_ID }}
      OIDC_CLIENT_SECRET: ${{ inputs.scope_profile == 'ls-aai-dev' && secrets.LS_AAI_DEV_OIDC_CLIENT_SECRET || secrets.EGI_DEV_OIDC_CLIENT_SECRET }}
