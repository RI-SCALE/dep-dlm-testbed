name: DEP DLM Testbed (egi-dev)

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:00 UTC, offset from the full-testbed run
    - cron: "0 3 * * *"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            runtime: compose
            daemon_mode: direct
          - arch: amd64
            runner: ubuntu-latest
            runtime: k8s
            daemon_mode: direct
    name: ${{ matrix.arch }} | ${{ matrix.runtime }} | ${{ matrix.daemon_mode }} | egi-dev
    uses: ./.github/workflows/_run-dep-dlm-testbed.yml
    with:
      runner: ${{ matrix.runner }}
      runtime: ${{ matrix.runtime }}
      daemon_mode: ${{ matrix.daemon_mode }}
      scope_profile: egi-dev
      token_modes: '["unmanaged"]'
    secrets:
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      OIDC_CLIENT_ID: ${{ secrets.EGI_DEV_OIDC_CLIENT_ID }}
      OIDC_CLIENT_SECRET: ${{ secrets.EGI_DEV_OIDC_CLIENT_SECRET }}
      EGI_TEST_SUB: ${{ secrets.EGI_TEST_SUB }}
