name: _run-dep-dlm-testbed

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      runtime:
        required: false
        type: string
        default: compose
        description: "compose | k8s"
      daemon_mode:
        required: false
        type: string
        default: direct
        description: "direct | daemons"
      scope_profile:
        required: false
        type: string
        default: local
        description: "local | egi-dev | <profile>"
      token_modes:
        required: false
        type: string
        default: '["managed","unmanaged"]'
        description: "JSON array of TOKEN_MODE values to run"
    secrets:
      S3_ACCESS_KEY:
        required: false
      S3_SECRET_KEY:
        required: false
      OIDC_CLIENT_ID:
        required: false
      OIDC_CLIENT_SECRET:
        required: false

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    name: ${{ inputs.runtime }} | ${{ inputs.daemon_mode }} | ${{ inputs.scope_profile }} | ${{ matrix.mode }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.token_modes) }}
    env:
      TESTBED_HOST_SOURCE: ${{ github.workspace }}
      RUNTIME: ${{ inputs.runtime }}
      TOKEN_MODE: ${{ matrix.mode }}
      DAEMON_MODE: ${{ inputs.daemon_mode }}
      SCOPE_PROFILE: ${{ inputs.scope_profile }}
      COMPOSE_FILE: deploy/compose/docker-compose.${{ matrix.mode }}.ci.yml
      OIDC_ISSUER: >-
        ${{
          inputs.scope_profile == 'egi-dev' && 'https://aai-dev.egi.eu/auth/realms/egi' ||
          inputs.scope_profile == 'ls-aai-dev' && 'https://login.aai.lifescience-ri.eu/oidc/' ||
          ''
        }}
      OIDC_TOKEN_URL: >-
        ${{
          inputs.scope_profile == 'ls-aai-dev' && 'https://login.aai.lifescience-ri.eu/oidc/token' ||
          ''
        }}
      OIDC_CLIENT_ID: ${{ inputs.scope_profile != 'local' && secrets.OIDC_CLIENT_ID || '' }}
      OIDC_CLIENT_SECRET: ${{ inputs.scope_profile != 'local' && secrets.OIDC_CLIENT_SECRET || '' }}
      OIDC_GRANT_TYPE: ${{ inputs.scope_profile != 'local' && 'client_credentials' || 'password' }}
      OIDC_EXPECTED_SCOPE: >-
        ${{
          inputs.scope_profile == 'egi-dev' && 'openid profile eduperson_entitlement offline_access read:/ write:/' ||
          inputs.scope_profile == 'ls-aai-dev' && 'openid profile eduperson_entitlement offline_access' ||
          ''
        }}
      OIDC_IDENTITY_SUB: >-
        ${{
          inputs.scope_profile == 'egi-dev' && 'aa886829a0a894933008498cfe62264d899422f55b408560a259311776f0e519@egi.eu' ||
          inputs.scope_profile == 'ls-aai-dev' && '28f7bc3a2d32a4a722f6eb24f77f7fbe42eb6471@lifescience-ri.eu' ||
          ''
        }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU for multi-arch emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Generate certificates
        run: make certs

      - name: Set up kind cluster
        if: inputs.runtime == 'k8s'
        uses: helm/kind-action@v1
        with:
          cluster_name: dep-dlm-testbed

      - name: Install Helm
        if: inputs.runtime == 'k8s'
        uses: azure/setup-helm@v4

      - name: Render idpsecrets.json from secrets
        if: inputs.scope_profile == 'egi-dev' || inputs.scope_profile == 'ls-aai-dev'
        run: |
          sed -i \
            -e "s|<valid client id>|${OIDC_CLIENT_ID}|g" \
            -e "s|<valid client secret>|${OIDC_CLIENT_SECRET}|g" \
            shared/config/rucio/${SCOPE_PROFILE}/idpsecrets.json

      - name: Start stack
        run: make start

      - name: Wait for rucio server ready (k8s)
        if: inputs.runtime == 'k8s'
        run: |
          kubectl -n dep-dlm-sandbox rollout status deploy/rucio-server --timeout=300s
          # Wait for postStart gfal2 install to complete before running tests.
          # The postStart hook runs asynchronously alongside httpd; rollout status
          # only confirms httpd readiness, not hook completion.
          echo "Waiting for gfal2 to be available in rucio container..."
          for i in $(seq 1 24); do
            kubectl -n dep-dlm-sandbox exec deploy/rucio-server -c rucio-server -- \
              python3 -c "import gfal2" 2>/dev/null && \
              { echo "gfal2 ready"; exit 0; }
            echo "  [$i] gfal2 not yet available, waiting 10s..."
            sleep 10
          done
          echo "ERROR: gfal2 not available after 240s — postStart hook may have failed"
          kubectl -n dep-dlm-sandbox describe pod -l app=rucio | grep -A 5 "Events:"
          exit 1

      - name: Wait for rucio daemons ready (k8s, daemon mode)
        if: inputs.runtime == 'k8s' && inputs.daemon_mode == 'daemons'
        run: |
          # In daemon mode the long-running daemons must converge before tests.
          # Their postStart also installs gfal2 asynchronously, and they race
          # the bootstrap job on first start, so wait for the deployments to
          # report available rather than assuming immediate readiness.
          for d in conveyor-submitter conveyor-poller conveyor-finisher \
                   judge-evaluator judge-cleaner reaper; do
            echo "Waiting for rucio-daemons-$d..."
            kubectl -n dep-dlm-sandbox rollout status \
              deploy/rucio-daemons-$d --timeout=300s || {
                echo "ERROR: rucio-daemons-$d did not become available"
                kubectl -n dep-dlm-sandbox describe deploy/rucio-daemons-$d | grep -A 5 "Events:" || true
                kubectl -n dep-dlm-sandbox logs deploy/rucio-daemons-$d --tail=50 || true
                exit 1
              }
          done
          echo "All daemons available"

      - name: Initialize DEP DLM testbed
        run: make init

      - name: Map identity to seeded account (compose)
        if: (inputs.scope_profile == 'egi-dev' || inputs.scope_profile == 'ls-aai-dev') && inputs.runtime == 'compose'
        run: |
          docker exec -t compose-rucio-server-1 \
            rucio-admin identity add --type OIDC \
              --id "SUB=${OIDC_IDENTITY_SUB}, ISS=${OIDC_ISSUER}" \
              --account randomaccount --email marvin.gajek@cern.ch

      - name: Map identity to seeded account (k8s)
        if: (inputs.scope_profile == 'egi-dev' || inputs.scope_profile == 'ls-aai-dev') && inputs.runtime == 'k8s'
        run: |
          kubectl -n dep-dlm-sandbox exec deploy/rucio-server -c rucio-server -- \
            rucio-admin identity add --type OIDC \
              --id "SUB=${OIDC_IDENTITY_SUB}, ISS=${OIDC_ISSUER}" \
              --account randomaccount --email marvin.gajek@cern.ch

      - name: Wait for fts (compose)
        if: inputs.runtime == 'compose'
        run: |
          for i in $(seq 1 40); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' \
              https://localhost:8446/whoami) || true
            [[ "$code" == "200" ]] && { echo "fts REST ready"; exit 0; }
            echo "  [$i] HTTP $code"; sleep 5
          done
          make logs SERVICES=fts; exit 1

      - name: Wait for fts (k8s)
        if: inputs.runtime == 'k8s'
        run: |
          kubectl -n dep-dlm-sandbox rollout status deploy/fts --timeout=300s
          for i in $(seq 1 40); do
            code=$(kubectl -n dep-dlm-sandbox exec deploy/fts -- \
              curl -sk -o /dev/null -w '%{http_code}' \
              https://localhost:8446/whoami) || true
            [[ "$code" == "200" ]] && { echo "fts REST ready"; exit 0; }
            echo "  [$i] HTTP $code"; sleep 5
          done
          kubectl -n dep-dlm-sandbox logs deploy/fts --tail=200; exit 1

      - name: Rucio E2E TPC transfer test
        run: make test-rucio-transfers

      - name: Rucio E2E TPC transfer test with Copernicus Sentinel data
        run: make test-copernicus-transfers

      - name: Rucio E2E deletion test
        run: make test-rucio-deletion

      # Diagnostics
      - name: Dump logs on failure (compose)
        if: failure() && inputs.runtime == 'compose'
        run: |
          for svc in fts rucio keycloak xrd3 xrd4 teapot1 teapot2; do
            echo "=== $svc ==="
            make logs SERVICES=$svc 2>/dev/null || true
          done

      - name: Dump logs on failure (k8s)
        if: failure() && inputs.runtime == 'k8s'
        run: |
          echo "=== Pod status ==="
          kubectl -n dep-dlm-sandbox get pods -o wide
          echo "=== Recent events ==="
          kubectl -n dep-dlm-sandbox get events --sort-by=.lastTimestamp | tail -50
          for deploy in fts rucio keycloak xrd3 xrd4 teapot1 teapot2; do
            echo "=== $deploy ==="
            kubectl -n dep-dlm-sandbox logs deploy/$deploy --tail=200 2>/dev/null || true
          done
          # Daemon diagnostics only relevant in daemon mode
          if [ "${{ inputs.daemon_mode }}" = "daemons" ]; then
            for d in conveyor-submitter conveyor-poller conveyor-finisher \
                     judge-evaluator judge-cleaner reaper; do
              echo "=== rucio-daemons-$d ==="
              kubectl -n dep-dlm-sandbox logs deploy/rucio-daemons-$d --tail=200 2>/dev/null || true
            done
          fi

      - name: Tear down
        if: always()
        run: make stop
