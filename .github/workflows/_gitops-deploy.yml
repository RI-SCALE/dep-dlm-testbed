name: _gitops-deploy

on:
  workflow_call:
    inputs:
      tf_env:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      gitops_engine:
        description: "argocd | flux"
        required: false
        type: string
        default: argocd
      deploy_depth:
        description: "gitops (install + full smoke tests) | e2e (also seed + run e2e tests)"
        required: false
        type: string
        default: gitops
      scope_profile:
        description: "egi-dev | ls-aai-dev — drives OIDC_ISSUER/OIDC_CLIENT_ID derivation in the Makefile. Without this, make init/test-rucio-transfers silently fall back to SCOPE_PROFILE=local's in-cluster Keycloak assumption, which doesn't exist on a real external-AAI deployment."
        required: false
        type: string
        default: egi-dev
      token_mode:
        description: "managed | unmanaged — passed through to make argocd-install/flux-install for Vault/token-exchange seeding"
        required: false
        type: string
        default: unmanaged
    secrets:
      OIDC_CLIENT_ID:
        required: true
      OIDC_CLIENT_SECRET:
        required: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.tf_env }}
  GITOPS_ENV: ${{ inputs.tf_env }}
  GITOPS_REPO_URL: https://github.com/${{ github.repository }}.git
  GITOPS_REVISION: ${{ github.ref_name }}
  SCOPE_PROFILE: ${{ inputs.scope_profile }}
  TOKEN_MODE: ${{ inputs.token_mode }}
  OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

jobs:
  # Single job, deliberately — install/smoke-test/e2e used to be three
  # separate jobs, each carrying its own `environment:` gate. GitHub
  # Actions requires a fresh approval PER JOB against a protected
  # Environment, so one logical, sequential pipeline was producing three
  # separate approval prompts. Consolidating into one job with step-level
  # `if:` conditions (gated on inputs.deploy_depth) keeps the exact same
  # sequencing and skip behavior, but only asks for approval once.
  deploy:
    name: ${{ inputs.gitops_engine }} deploy (${{ inputs.deploy_depth }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}

      RUNTIME: k8s
      K8S_NAMESPACE: dep-dlm-${{ inputs.tf_env }}

      SKIP_VALIDATION_STORAGE_CHECKS: "1"
      SKIP_DB_CHECKS: "1"
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: make tf-init
        run: make tf-init

      - name: Fetch kubeconfig
        run: make tf-kubeconfig

      # ── install (always runs) ────────────────────────────────────────

      - name: Uninstall the other gitops engine, if present
        run: |
          if [ "${{ inputs.gitops_engine }}" != "argocd" ] && kubectl get namespace argocd >/dev/null 2>&1; then
            echo "Existing ArgoCD installation detected — uninstalling"
            make argocd-uninstall
          fi
          if [ "${{ inputs.gitops_engine }}" != "flux" ] && kubectl get namespace flux-system >/dev/null 2>&1; then
            echo "Existing Flux installation detected — uninstalling"
            make flux-uninstall
          fi

      - name: make ${{ inputs.gitops_engine }}-install
        run: make ${{ inputs.gitops_engine }}-install

      - name: Wait for ArgoCD Applications to become Healthy
        if: inputs.gitops_engine == 'argocd'
        uses: ./.github/actions/wait-for-argocd-healthy

      - name: Wait for Flux Kustomizations/HelmReleases to be Ready
        if: inputs.gitops_engine == 'flux'
        uses: ./.github/actions/wait-for-flux-ready

      # rucio-server and the daemons (conveyor-*, judge-*, reaper) all read
      # rucio.cfg/idpsecrets.json once at startup — a Terraform-driven
      # secret change won't reach already-running processes without a
      # restart.
      - name: Restart rucio-server and daemons to pick up latest secrets
        run: |
          ns=dep-dlm-${{ inputs.tf_env }}
          kubectl -n "$ns" annotate externalsecret testbed-secrets \
            force-sync="$(date +%s)" --overwrite
          kubectl -n "$ns" get deploy/rucio-server >/dev/null 2>&1 && \
            kubectl -n "$ns" rollout restart deploy/rucio-server || true
          for d in conveyor-submitter conveyor-poller conveyor-finisher \
                   judge-evaluator judge-cleaner reaper; do
            kubectl -n "$ns" get deploy/rucio-daemons-$d >/dev/null 2>&1 && \
              kubectl -n "$ns" rollout restart deploy/rucio-daemons-$d
          done

      - name: Verify workload pods are Running
        run: |
          ns=dep-dlm-${{ inputs.tf_env }}
          kubectl -n $ns wait --for=condition=complete job/rucio-bootstrap-db --timeout=300s
          kubectl -n $ns rollout status deploy/rucio-server --timeout=300s
          kubectl -n $ns rollout status deploy/fts --timeout=300s
          for d in conveyor-submitter conveyor-poller conveyor-finisher \
                   judge-evaluator judge-cleaner reaper; do
            kubectl -n $ns get deploy/rucio-daemons-$d >/dev/null 2>&1 && \
              kubectl -n $ns rollout status deploy/rucio-daemons-$d --timeout=300s
          done
          kubectl -n $ns get pods

      - name: Wait for Gateway to be Programmed
        run: |
          ns=dep-dlm-${{ inputs.tf_env }}
          gw=dep-dlm-${{ inputs.tf_env }}-gateway
          for i in $(seq 1 40); do
            addr=$(kubectl -n "$ns" get gateway "$gw" -o jsonpath='{.status.addresses[0].value}' 2>/dev/null)
            programmed=$(kubectl -n "$ns" get gateway "$gw" -o jsonpath='{.status.conditions[?(@.type=="Programmed")].status}' 2>/dev/null)
            echo "  [$i] address=${addr:-<none>} programmed=${programmed:-<none>}"
            if [ "$programmed" = "True" ] && [ -n "$addr" ]; then
              echo "Gateway is Programmed with address $addr"; exit 0
            fi
            sleep 15
          done
          echo "ERROR: Gateway did not become Programmed in time"
          kubectl -n "$ns" describe gateway "$gw"
          exit 1

      - name: Diagnostics on install failure
        if: failure()
        run: |
          if [ "${{ inputs.gitops_engine }}" = "argocd" ]; then
            echo "=== Applications ==="; kubectl -n argocd get applications -o wide || true
          else
            echo "=== Kustomizations ==="; flux get kustomizations || true
            echo "=== HelmReleases ==="; flux get helmreleases -A || true
          fi
          echo "=== Pods ==="; kubectl -n dep-dlm-${{ inputs.tf_env }} get pods -o wide || true
          echo "=== Events ==="
          kubectl -n dep-dlm-${{ inputs.tf_env }} get events --sort-by=.lastTimestamp | tail -50 || true

      # ── smoke-test-full (always runs, once install succeeds) ──────────

      - name: Install smoke test dependencies
        run: |
          pip install --break-system-packages \
            pytest google-cloud-secret-manager requests

      - name: make tf-smoke-test
        run: make tf-smoke-test

      # ── seed-and-e2e (only when deploy_depth == 'e2e') ─────────────────

      - name: make init
        if: inputs.deploy_depth == 'e2e'
        run: make init

      - name: make test-rucio-transfers
        if: inputs.deploy_depth == 'e2e'
        run: make test-rucio-transfers
