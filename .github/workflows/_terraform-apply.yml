name: _terraform-apply

on:
  workflow_call:
    inputs:
      tf_env:
        description: "Environment directory name under deploy/terraform/environments/ (e.g. staging, production)"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment to resolve vars from and gate apply behind (usually the same as tf_env)"
        required: true
        type: string
      scope_profile:
        description: "local | egi-dev | ls-aai-dev — drives OIDC_ISSUER/OIDC_CLIENT_ID derivation in the Makefile (see verify-idp-token). Only OIDC_CLIENT_SECRET needs to travel as a real secret."
        required: false
        type: string
        default: egi-dev
    secrets:
      OIDC_CLIENT_ID:
        required: true
      OIDC_CLIENT_SECRET:
        required: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.tf_env }}
  SCOPE_PROFILE: ${{ inputs.scope_profile }}
  OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
    outputs:
      certs_artifact_id: ${{ steps.upload-certs.outputs.artifact-id }}
      tfplan_artifact_id: ${{ steps.upload-tfplan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Generate certificates
        run: make certs

      - name: Upload certs artifact
        id: upload-certs
        uses: actions/upload-artifact@v4
        with:
          name: certs-${{ inputs.tf_env }}
          path: certs/
          retention-days: 1

      - name: make tf-init
        run: make tf-init

      - name: make tf-validate
        run: make tf-validate

      - name: make tf-plan
        run: make tf-plan

      - name: Upload plan artifact
        id: upload-tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.tf_env }}
          path: deploy/terraform/environments/${{ inputs.tf_env }}/tfplan
          retention-days: 1

  apply:
    name: apply
    needs: plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Download certs artifact
        uses: actions/download-artifact@v4
        with:
          name: certs-${{ inputs.tf_env }}
          path: certs/

      - name: make tf-init
        run: make tf-init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.tf_env }}
          path: deploy/terraform/environments/${{ inputs.tf_env }}

      - name: make tf-apply
        run: make tf-apply AUTO_APPROVE=1

  smoke-test:
    name: smoke test (infra only)
    needs: apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
      # No gitops engine installed at this stage — public endpoint tests
      # would fail deterministically, not flakily, so they're skipped
      # here rather than allowed to fail. _gitops-deploy.yml's smoke-test
      # job runs the full suite, including these, once an engine is up.
      SKIP_GATEWAY_CHECKS: "1"
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: make tf-init
        run: make tf-init

      - name: Fetch kubeconfig
        run: make tf-kubeconfig

      - name: Install smoke test dependencies
        run: |
          pip install --break-system-packages \
            pytest google-cloud-secret-manager requests

      - name: make tf-smoke-test
        run: make tf-smoke-test

  cleanup:
    name: delete sensitive artifacts
    needs: [plan, apply]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete certs artifact
        if: needs.plan.outputs.certs_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/actions/artifacts/${{ needs.plan.outputs.certs_artifact_id }}"

      - name: Delete plan artifact
        if: needs.plan.outputs.tfplan_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/actions/artifacts/${{ needs.plan.outputs.tfplan_artifact_id }}"
