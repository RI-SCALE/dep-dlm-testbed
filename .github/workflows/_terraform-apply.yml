name: _terraform-apply

on:
  workflow_call:
    inputs:
      tf_env:
        description: "Environment directory name under deploy/terraform/environments/ (e.g. staging, production)"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment to resolve vars from and gate apply behind (usually the same as tf_env)"
        required: true
        type: string
      scope_profile:
        description: "local | egi-dev | ls-aai-dev — drives OIDC_ISSUER/OIDC_CLIENT_ID derivation in the Makefile (see verify-idp-token). Only OIDC_CLIENT_SECRET needs to travel as a real secret."
        required: false
        type: string
        default: egi-dev
    secrets:
      OIDC_CLIENT_ID:
        required: true
      OIDC_CLIENT_SECRET:
        required: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.tf_env }}
  SCOPE_PROFILE: ${{ inputs.scope_profile }}
  OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

jobs:
  # Single job, deliberately — plan/apply/smoke-test used to be three jobs,
  # each carrying its own `environment:` gate, so a protected Environment
  # with required reviewers produced three separate approval prompts for
  # one sequential pipeline. AUTO_APPROVE=1 already makes `terraform apply`
  # non-interactive, so the old split never actually let a reviewer inspect
  # the plan before approving apply's gate — the approval happens before
  # `plan` even runs either way. Consolidating loses nothing real and cuts
  # three approvals down to one. Also drops the certs/plan artifact
  # upload+download round-trip, since everything now shares one runner's
  # filesystem instead of crossing job boundaries.
  apply:
    name: plan, apply & smoke test (infra only)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
      # No gitops engine installed at this stage — public endpoint tests
      # would fail deterministically, not flakily, so they're skipped
      # here rather than allowed to fail. _gitops-deploy.yml's smoke-test
      # step runs the full suite, including these, once an engine is up.
      SKIP_GATEWAY_CHECKS: "1"
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── plan ──────────────────────────────────────────────────────────

      # No longer uploaded as an artifact — certs/ and tfplan stay on this
      # runner's filesystem and feed straight into the apply/smoke-test
      # steps below, since it's all one job now.
      - name: Generate certificates
        run: make certs

      - name: make tf-init
        run: make tf-init

      - name: make tf-validate
        run: make tf-validate

      - name: make tf-plan
        run: make tf-plan

      # ── apply ─────────────────────────────────────────────────────────

      - name: make tf-apply
        run: make tf-apply AUTO_APPROVE=1

      # ── smoke-test (infra only) ─────────────────────────────────────

      - name: Fetch kubeconfig
        run: make tf-kubeconfig

      - name: Install smoke test dependencies
        run: |
          pip install --break-system-packages \
            pytest google-cloud-secret-manager requests

      - name: make tf-smoke-test
        run: make tf-smoke-test

      # ── cleanup ──────────────────────────────────────────────────────
      # certs/ contains real private key material and never leaves this
      # runner (no artifact upload to delete) — GitHub tears down the
      # runner's filesystem after the job regardless, but wipe it
      # explicitly here too rather than relying solely on that.
      - name: Remove local certs
        if: always()
        run: rm -rf certs/
