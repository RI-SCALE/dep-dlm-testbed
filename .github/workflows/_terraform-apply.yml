name: _terraform-apply

on:
  workflow_call:
    inputs:
      tf_env:
        description: "Environment directory name under deploy/terraform/environments/ (e.g. staging, production)"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment to resolve vars from and gate apply behind (usually the same as tf_env)"
        required: true
        type: string
      scope_profile:
        description: "local | egi-dev | ls-aai-dev — drives OIDC_ISSUER/OIDC_CLIENT_ID derivation in the Makefile (see verify-idp-token). Only OIDC_CLIENT_SECRET needs to travel as a real secret."
        required: false
        type: string
        default: egi-dev
      token_mode:
        description: "managed | unmanaged — passed through to make argocd-install for Vault/token-exchange seeding"
        required: false
        type: string
        default: unmanaged
    secrets:
      OIDC_CLIENT_ID:
        required: true
      OIDC_CLIENT_SECRET:
        required: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.tf_env }}
  SCOPE_PROFILE: ${{ inputs.scope_profile }}
  TOKEN_MODE: ${{ inputs.token_mode }}
  OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write   # required for WIF OIDC token exchange
      contents: read
      pull-requests: write # to comment the plan on PRs
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
    outputs:
      certs_artifact_id: ${{ steps.upload-certs.outputs.artifact-id }}
      tfplan_artifact_id: ${{ steps.upload-tfplan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Generated ONCE, here, and shared with apply via artifact below —
      # NOT re-run in the apply job. generate-certs.sh produces fresh,
      # non-deterministic random key material every invocation; plan and
      # apply are separate jobs on separate runners, so calling `make
      # certs` independently in each produces DIFFERENT bytes, which
      # breaks apply ("Provider produced inconsistent final plan") since
      # certs.tf's file() calls re-evaluate at apply time. Same certs,
      # byte-for-byte, in both jobs is the fix.
      #
      # retention-days: 1 (the platform minimum) is a backstop only —
      # the "cleanup" job below deletes this explicitly, on success or
      # failure, since it contains real private key material.
      - name: Generate certificates
        run: make certs

      - name: Upload certs artifact
        id: upload-certs
        uses: actions/upload-artifact@v4
        with:
          name: certs-${{ inputs.tf_env }}
          path: certs/
          retention-days: 1

      - name: make tf-init
        run: make tf-init

      - name: make tf-validate
        run: make tf-validate

      - name: make tf-plan
        run: make tf-plan

      # retention-days: 1 here too, same reasoning — a saved plan file's
      # sensitive values are NOT redacted internally (sensitive = true
      # only hides them from console output), so this holds real
      # secrets (DB passwords, OIDC_CLIENT_SECRET) until "cleanup"
      # deletes it explicitly.
      - name: Upload plan artifact
        id: upload-tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.tf_env }}
          path: deploy/terraform/environments/${{ inputs.tf_env }}/tfplan
          retention-days: 1

  apply:
    name: apply
    needs: plan
    # push re-added deliberately: staging's caller (terraform-staging.yml)
    # is the only one with an `on: push:` trigger at all — production's
    # caller only has workflow_dispatch, so this never fires push-triggered
    # applies against production regardless of this condition living here
    # in the shared workflow.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }} # GitHub Environment — add required reviewers here for a manual approval gate
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # Downloaded, not regenerated — must be byte-identical to what
      # `plan` used, see that job's comment.
      - name: Download certs artifact
        uses: actions/download-artifact@v4
        with:
          name: certs-${{ inputs.tf_env }}
          path: certs/

      - name: make tf-init
        run: make tf-init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.tf_env }}
          path: deploy/terraform/environments/${{ inputs.tf_env }}

      # tf-apply uses the downloaded tfplan artifact automatically if
      # present (see the Makefile target) — guarantees apply does
      # precisely what was reviewed in `plan`, not whatever a fresh
      # `terraform plan` would produce if state drifted in between.
      - name: make tf-apply
        run: make tf-apply AUTO_APPROVE=1

  argocd-install:
    name: argocd install
    needs: apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
      GITOPS_ENV: ${{ inputs.tf_env }}
      GITOPS_REPO_URL: https://github.com/${{ github.repository }}.git
      GITOPS_REVISION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      # No certs artifact needed — argocd-install.sh seeds Vault/secrets
      # from Terraform outputs and Secret Manager directly, not from
      # local certs/ the way `make certs` produces for tf-apply.
      - name: make tf-init
        run: make tf-init

      - name: Fetch kubeconfig
        run: make tf-kubeconfig

      - name: make argocd-install
        run: make argocd-install

  smoke-test:
    name: smoke test
    needs: argocd-install
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }} # same Environment-scoped vars as plan/apply (GCP_PROJECT_ID etc.) — no second approval prompt, GitHub gates this per workflow-run + environment, not per-job
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No certs/tfplan artifacts needed here — this job only reads
      # existing state (terraform output) and queries the already-applied
      # infrastructure directly, doesn't re-plan or re-apply anything.
      - name: make tf-init
        run: make tf-init

      - name: Fetch kubeconfig
        run: make tf-kubeconfig

      - name: Install smoke test dependencies
        run: |
          pip install --break-system-packages \
            pytest google-cloud-secret-manager

      - name: make tf-smoke-test
        run: make tf-smoke-test

  cleanup:
    name: delete sensitive artifacts
    needs: [plan, apply]
    if: always() # run whether plan/apply succeeded, failed, or apply was skipped
    runs-on: ubuntu-latest
    permissions:
      actions: write # required to delete artifacts via the REST API
    steps:
      - name: Delete certs artifact
        if: needs.plan.outputs.certs_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/actions/artifacts/${{ needs.plan.outputs.certs_artifact_id }}"

      - name: Delete plan artifact
        if: needs.plan.outputs.tfplan_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/actions/artifacts/${{ needs.plan.outputs.tfplan_artifact_id }}"
