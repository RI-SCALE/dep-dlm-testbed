name: _terraform-apply

on:
  workflow_call:
    inputs:
      tf_env:
        description: "Environment directory name under deploy/terraform/environments/ (e.g. staging, production)"
        required: true
        type: string
      environment_name:
        description: "GitHub Environment to resolve vars from and gate apply behind (usually the same as tf_env)"
        required: true
        type: string
      scope_profile:
        description: "local | egi-dev | ls-aai-dev — drives OIDC_ISSUER/OIDC_CLIENT_ID derivation in the Makefile (see verify-idp-token). Only OIDC_CLIENT_SECRET needs to travel as a real secret."
        required: false
        type: string
        default: egi-dev
    secrets:
      OIDC_CLIENT_ID:
        required: true
      OIDC_CLIENT_SECRET:
        required: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.tf_env }}
  SCOPE_PROFILE: ${{ inputs.scope_profile }}
  OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

jobs:
  apply:
    name: plan, apply & smoke test (infra only)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_NETWORK_ID: ${{ vars.TF_NETWORK_ID }}
      TF_SUBNET_ID: ${{ vars.TF_SUBNET_ID }}
      TF_PODS_RANGE_NAME: ${{ vars.TF_PODS_RANGE_NAME }}
      TF_SERVICES_RANGE_NAME: ${{ vars.TF_SERVICES_RANGE_NAME }}
      SKIP_GATEWAY_CHECKS: "1"
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: make tf-init
        run: make tf-init

      # ── generate certs (pass 1, no external SAN yet) ──────────────────
      # Even with -target, Terraform evaluates every resource's arguments
      # while building the plan graph -- including module.secrets' file()
      # calls -- regardless of which resources are actually targeted for
      # apply. certs/ has to exist on disk before ANY terraform
      # plan/apply runs, including the targeted one below, or these
      # file() lookups fail outright. This first pass has no
      # VALSTORAGE_EXTERNAL_SAN (the IP doesn't exist yet); it exists
      # only so the upcoming targeted apply has files to read.
      - name: Generate certificates (pass 1, no external SAN)
        run: make certs

      # ── self-heal: import the static IP if a prior run created it in
      #    GCP but didn't get to record it in Terraform state (e.g. a
      #    cancelled/failed job between resource creation and state
      #    write) — without this, every subsequent run 409s forever.
      - name: Import validation-storage IP if orphaned
        run: |
          ADDR_NAME="dep-dlm-${{ inputs.tf_env }}-validation-storage-ip"
          if terraform -chdir=deploy/terraform/environments/${{ inputs.tf_env }} state list \
              | grep -qx 'module.validation_storage.google_compute_address.this'; then
            echo "Already tracked in state — nothing to do."
            exit 0
          fi
          if gcloud compute addresses describe "$ADDR_NAME" \
              --region="${{ vars.GCP_REGION }}" \
              --project="${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "Address exists in GCP but not in state — importing."
            make tf-import \
              RESOURCE=module.validation_storage.google_compute_address.this \
              ID="projects/${{ vars.GCP_PROJECT_ID }}/regions/${{ vars.GCP_REGION }}/addresses/$ADDR_NAME"
          else
            echo "Address doesn't exist yet — normal first-run case, tf-apply will create it."
          fi

      # ── reserve validation-storage's static IP ────────────────────────
      # validation-storage's xrd3/xrd4/teapot1/teapot2 certs need the VM's
      # public IP baked into their SAN (see generate-certs.sh's
      # VALSTORAGE_EXTERNAL_SAN) so external TLS clients can verify them
      # -- but that IP only exists once google_compute_address.this is
      # actually created. -target applies just that one resource so the
      # IP is available before certs are regenerated with it, without
      # doing a full apply twice. Idempotent on every run after the
      # address already exists.
      - name: Reserve validation-storage static IP (targeted apply)
        run: make tf-apply AUTO_APPROVE=1 TF_TARGET=module.validation_storage.google_compute_address.this

      - name: Read validation-storage IP
        id: valstorage_ip
        run: |
          IP=$(terraform -chdir=deploy/terraform/environments/${{ inputs.tf_env }} \
            output -raw validation_storage_ip)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # ── plan ──────────────────────────────────────────────────────────

      # Pass 2: regenerate with the real IP now baked into the four
      # external services' SANs. Overwrites pass 1's placeholder certs --
      # these are the ones that actually get uploaded to Secret Manager
      # by the full apply below.
      - name: Generate certificates (pass 2, with external SAN)
        env:
          VALSTORAGE_EXTERNAL_SAN: ${{ steps.valstorage_ip.outputs.ip }},valstorage.${{ inputs.tf_env }}.dep-dlm.example.com
        run: make certs

      - name: make tf-validate
        run: make tf-validate

      - name: make tf-plan
        run: make tf-plan

      # ── apply ─────────────────────────────────────────────────────────

      - name: make tf-apply
        run: make tf-apply AUTO_APPROVE=1

      # ── reset validation-storage so it re-pulls certs/config ──────────
      # Terraform apply only *uploads* new secret versions to GSM; the VM's
      # startup-script (which wipes/re-populates $CONFIG_DIR and pulls
      # fresh cert bytes) only runs at boot — metadata-only updates don't
      # re-trigger it. Without an explicit reset, cert/config fixes land
      # in Secret Manager but never reach the running instance.
      - name: Reset validation-storage instance
        if: inputs.tf_env == 'staging'
        run: |
          gcloud compute instances reset "dep-dlm-${{ inputs.tf_env }}-validation-storage" \
            --zone="${{ vars.GCP_ZONE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"
          # give the startup-script + container stack time to come back
          sleep 15

      # ── smoke-test (infra only) ─────────────────────────────────────

      - name: Fetch kubeconfig
        run: make tf-kubeconfig

      - name: Install smoke test dependencies
        run: |
          pip install --break-system-packages \
              pytest google-cloud-secret-manager requests

      - name: make tf-smoke-test
        run: make tf-smoke-test

      # ── cleanup ──────────────────────────────────────────────────────
      - name: Remove local certs
        if: always()
        run: rm -rf certs/
