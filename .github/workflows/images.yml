name: Docker Images

# Testbed-only images. Rucio server/daemons and FTS are built in
# RI-SCALE/dep-dlm-containers.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PREFIX: ghcr.io/ri-scale/dep-dlm-testbed

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [teapot, rucio-client]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile.${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.PREFIX }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    name: manifest ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [teapot, rucio-client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        working-directory: /tmp/digests
        run: |
          ref="${PREFIX}/${IMAGE}"
          docker buildx imagetools create -t "${ref}:${GITHUB_SHA}" $(printf "${ref}@sha256:%s " *)
          echo "digest=$(docker buildx imagetools inspect "${ref}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.image }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
