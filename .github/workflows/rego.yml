name: Rego

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rego:
    name: Rego - unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.1
      - run: make test-rego
