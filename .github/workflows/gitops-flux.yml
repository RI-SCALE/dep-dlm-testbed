name: GitOps (Flux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/gitops/**'
      - 'deploy/helm-charts/**'
      - 'shared/scripts/init-flux.sh'
      - '.github/workflows/gitops-flux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/gitops/**'
      - 'deploy/helm-charts/**'
      - 'shared/scripts/init-flux.sh'
      - '.github/workflows/gitops-flux.yml'

jobs:
  flux:
    name: flux | ${{ matrix.env }} | ${{ matrix.scope_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [sandbox]          # staging/production need external Vault/DB/IdP
        scope_profile: [local, egi-dev, ls-aai-dev]
    env:
      GITOPS_ENV: ${{ matrix.env }}
      # Point Argo/Flux at THIS PR's repo+branch — see inline comment below,
      # unchanged from before.
      GITOPS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
      GITOPS_REVISION: ${{ github.head_ref || github.ref_name }}
      SCOPE_PROFILE: ${{ matrix.scope_profile }}
      # egi-dev only passes with client_credentials — token-exchange is
      # non-viable against EGI Check-In Dev (see BYO IdP runbook, "CA trust"
      # / token_strategy caveat). local keeps the default managed flow.
      TOKEN_MODE: ${{ matrix.scope_profile == 'egi-dev' && 'unmanaged' || 'managed' }}
      OIDC_ISSUER: >-
        ${{
          matrix.scope_profile == 'egi-dev' && 'https://aai-dev.egi.eu/auth/realms/egi' ||
          matrix.scope_profile == 'ls-aai-dev' && 'https://login.aai.lifescience-ri.eu/oidc/' ||
          ''
        }}
      OIDC_TOKEN_URL: >-
        ${{
          matrix.scope_profile == 'ls-aai-dev' && 'https://login.aai.lifescience-ri.eu/oidc/token' ||
          ''
        }}
      OIDC_CLIENT_ID: >-
        ${{
          matrix.scope_profile == 'egi-dev' && secrets.EGI_DEV_OIDC_CLIENT_ID ||
          matrix.scope_profile == 'ls-aai-dev' && secrets.LS_AAI_DEV_OIDC_CLIENT_ID ||
          ''
        }}
      OIDC_CLIENT_SECRET: >-
        ${{
          matrix.scope_profile == 'egi-dev' && secrets.EGI_DEV_OIDC_CLIENT_SECRET ||
          matrix.scope_profile == 'ls-aai-dev' && secrets.LS_AAI_DEV_OIDC_CLIENT_SECRET ||
          ''
        }}
      OIDC_GRANT_TYPE: ${{ matrix.scope_profile != 'local' && 'client_credentials' || '' }}
      OIDC_STORAGE_SCOPE: >-
        ${{
          matrix.scope_profile == 'egi-dev' && 'openid profile eduperson_entitlement offline_access read:/ write:/' ||
          matrix.scope_profile == 'ls-aai-dev' && 'openid profile eduperson_entitlement offline_access' ||
          ''
        }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      RUNTIME: k8s
      DAEMON_MODE: daemons
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dep-dlm-gitops

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Install Flux + bootstrap ${{ matrix.env }}
        run: make flux-install

      - name: Wait for all Kustomizations to be Ready
        run: |
          # Reconciling the top Kustomization only confirms it APPLIED its
          # manifests — the dependsOn chain (eso->core->secrets->bootstrap->
          # components) is still settling. Wait for EVERY dep-dlm Kustomization to
          # report Ready, which only happens once each stage's wait/healthChecks
          # pass (the components stage Ready == its HelmReleases installed).
          ns=flux-system
          for i in $(seq 1 60); do
            total=$(kubectl -n $ns get kustomizations.kustomize.toolkit.fluxcd.io \
              -o name 2>/dev/null | grep dep-dlm | wc -l | tr -d ' ')
            ready=$(kubectl -n $ns get kustomizations.kustomize.toolkit.fluxcd.io \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' 2>/dev/null \
              | grep '^dep-dlm' | awk '$2=="True"' | wc -l | tr -d ' ')
            echo "  [$i] $ready/$total dep-dlm Kustomizations Ready"
            if [ "$total" -gt 0 ] && [ "$ready" = "$total" ]; then
              echo "All Kustomizations Ready"; break
            fi
            sleep 15
            [ "$i" = 60 ] && { echo "ERROR: Kustomizations not Ready in time"; flux get kustomizations; exit 1; }
          done

      - name: Wait for all HelmReleases to be Ready
        run: |
          # The real convergence gate: every HelmRelease must finish installing.
          # (A Kustomization can be Ready while a HelmRelease it applied is still
          # 'Running install' — so assert on the HelmReleases directly.)
          ns=flux-system
          for i in $(seq 1 60); do
            total=$(kubectl -n $ns get helmreleases.helm.toolkit.fluxcd.io \
              -o name 2>/dev/null | wc -l | tr -d ' ')
            ready=$(kubectl -n $ns get helmreleases.helm.toolkit.fluxcd.io \
              -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' 2>/dev/null \
              | awk '$2=="True"' | wc -l | tr -d ' ')
            echo "  [$i] $ready/$total HelmReleases Ready"
            if [ "$total" -gt 0 ] && [ "$ready" = "$total" ]; then
              echo "All HelmReleases Ready"; exit 0
            fi
            # Show the laggards (name + Ready status + message).
            kubectl -n $ns get helmreleases.helm.toolkit.fluxcd.io \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\t"}{.message}{end}{"\n"}{end}' 2>/dev/null \
              | awk -F'\t' '$2!="True"' | sed 's/^/      pending: /' || true
            sleep 15
          done
          echo "ERROR: HelmReleases did not all become Ready in time"
          flux get helmreleases -A
          exit 1

      - name: Verify workload pods are Running
        run: |
          ns=dep-dlm-${{ matrix.env }}
          # No '|| true' — rucio MUST be installed and rolled out. (Previously this
          # was masked, so a missing rucio Deployment still passed.)
          kubectl -n $ns wait --for=condition=complete job/rucio-bootstrap-db --timeout=300s
          kubectl -n $ns rollout status deploy/rucio-server --timeout=300s
          for d in conveyor-submitter conveyor-poller conveyor-finisher \
                   judge-evaluator judge-cleaner reaper; do
            kubectl -n $ns rollout status deploy/rucio-daemons-$d --timeout=300s
          done
          kubectl -n $ns get pods

      - name: Patch Vault egi-dev/ls-aai-dev OIDC credentials
        if: matrix.scope_profile != 'local'
        run: |
          ns=dep-dlm-${{ matrix.env }}
          kubectl exec -n "$ns" vault-0 -- sh -c '
            VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root \
            vault kv get -mount=secret -field=idpsecrets.json dep-dlm/secrets
          ' | sed -e "s|<valid client id>|$OIDC_CLIENT_ID|g" -e "s|<valid client secret>|$OIDC_CLIENT_SECRET|g" > /tmp/idpsecrets.json
          kubectl cp /tmp/idpsecrets.json "$ns"/vault-0:/tmp/idpsecrets.json
          kubectl exec -n "$ns" vault-0 -- sh -c '
            VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root \
            vault kv patch -mount=secret dep-dlm/secrets idpsecrets.json=@/tmp/idpsecrets.json
          '
          rm /tmp/idpsecrets.json
          kubectl annotate externalsecret testbed-secrets -n "$ns" force-sync=$(date +%s) --overwrite
          kubectl rollout restart deployment rucio-server rucio-daemons-conveyor-finisher \
            rucio-daemons-conveyor-poller rucio-daemons-conveyor-submitter \
            rucio-daemons-judge-cleaner rucio-daemons-judge-evaluator rucio-daemons-reaper \
            -n "$ns"
          kubectl -n "$ns" rollout status deploy/rucio-server --timeout=300s

      - name: Initialize testbed (accounts, RSEs, OIDC)
        run: make init

      - name: Rucio E2E transfer tests
        run: make test-rucio-transfers

      - name: Rucio E2E TPC transfer test with Copernicus Sentinel data
        run: make test-copernicus-transfers

      - name: Rucio E2E deletion test
        run: make test-rucio-deletion

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Kustomizations ==="; flux get kustomizations || true
          echo "=== HelmReleases ==="; flux get helmreleases -A || true
          echo "=== Pods ==="; kubectl -n dep-dlm-${{ matrix.env }} get pods -o wide || true
          echo "=== Events ==="
          kubectl -n dep-dlm-${{ matrix.env }} get events --sort-by=.lastTimestamp | tail -50 || true
          for d in vault-seed rucio-bootstrap-db; do
            echo "=== job/$d ==="
            kubectl -n dep-dlm-${{ matrix.env }} logs job/$d --tail=50 2>/dev/null || true
          done

      - name: Tear down
        if: always()
        run: make flux-uninstall || true
