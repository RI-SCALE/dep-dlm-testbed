name: DEP DLM Testbed (ls-aai-dev)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            runtime: compose
            daemon_mode: direct
    name: ${{ matrix.arch }} | ${{ matrix.runtime }} | ${{ matrix.daemon_mode }} | ls-aai-dev
    uses: ./.github/workflows/_run-dep-dlm-testbed.yml
    with:
      runner: ${{ matrix.runner }}
      runtime: ${{ matrix.runtime }}
      daemon_mode: ${{ matrix.daemon_mode }}
      scope_profile: ls-aai-dev
      token_modes: '["unmanaged"]'
    secrets:
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      OIDC_CLIENT_ID: ${{ secrets.LS_AAI_DEV_OIDC_CLIENT_ID }}
      OIDC_CLIENT_SECRET: ${{ secrets.LS_AAI_DEV_OIDC_CLIENT_SECRET }}
