name: Terraform destroy (production)

# Manual-only, on purpose. Kept as a fully separate file from
# terraform-destroy-staging.yml (not a parameterized single workflow)
# specifically so the confirmation string, trigger surface, and
# environment gate for production can never be accidentally pointed at
# staging or vice versa.
#
# Does NOT delete the state bucket — that's bootstrap-level state now,
# not environments/<env>'s; see deploy/terraform/README.md's Teardown
# section for the (human-run) `gcloud projects delete` path.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm you want to destroy the production environment'
        required: true

jobs:
  destroy:
    uses: ./.github/workflows/_terraform-destroy.yml
    with:
      tf_env: production
      environment_name: production
      confirm: ${{ inputs.confirm }}
