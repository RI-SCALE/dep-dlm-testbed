name: Terraform (staging)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/terraform-staging.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/terraform-staging.yml'

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: staging
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  fmt-check:
    name: fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8" # pin explicitly rather than "latest" for reproducible CI runs

      - name: make tf-fmt
        run: make tf-fmt

  prepare-backend:
    name: prepare state bucket
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/165399374844/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: dep-dlm-terraform-ci@project-724bc3b5-635b-4922-bb7.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Idempotent by construction (see the Makefile target itself) —
      # only ever CREATES, never deletes; see terraform-teardown.yml for
      # that, deliberately isolated into its own manually-triggered
      # workflow and its own make target (tf-destroy-state-bucket).
      - name: make tf-prepare-backend
        run: make tf-prepare-backend

  plan:
    name: plan
    needs: [fmt-check, prepare-backend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for WIF OIDC token exchange
      contents: read
      pull-requests: write # to comment the plan on PRs
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/165399374844/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: dep-dlm-terraform-ci@project-724bc3b5-635b-4922-bb7.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: make tf-init
        run: make tf-init

      - name: make tf-validate
        run: make tf-validate

      - name: make tf-plan
        run: make tf-plan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: deploy/terraform/environments/staging/tfplan
          retention-days: 5

  apply:
    name: apply
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging # GitHub Environment — add required reviewers here for a manual approval gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/165399374844/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: dep-dlm-terraform-ci@project-724bc3b5-635b-4922-bb7.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: make tf-init
        run: make tf-init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: deploy/terraform/environments/staging

      # tf-apply uses the downloaded tfplan artifact automatically if
      # present (see the Makefile target) — guarantees apply does
      # precisely what was reviewed in `plan`, not whatever a fresh
      # `terraform plan` would produce if state drifted in between.
      - name: make tf-apply
        run: make tf-apply AUTO_APPROVE=1
