name: Destroy (staging)

# Manual-only, on purpose — this is the one place in environments/<env>'s
# CI where destructive resource deletion lives, kept out of
# terraform-staging.yml so a normal push/PR can never trigger it.
# Requires typing the environment name exactly, on top of GitHub's own
# environment approval gate.
#
# Does NOT delete the state bucket — that's bootstrap-level state now,
# not environments/<env>'s; see deploy/terraform/README.md's Teardown
# section for the (human-run) `gcloud projects delete` path.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "staging" to confirm you want to destroy the staging environment'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    uses: ./.github/workflows/_terraform-destroy.yml
    with:
      tf_env: staging
      environment_name: staging
      confirm: ${{ inputs.confirm }}
