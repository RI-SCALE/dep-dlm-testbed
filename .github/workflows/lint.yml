name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.64.0"
      - uses: azure/setup-helm@v4
      - name: Install helm-git plugin
        run: |
          if [ ! -d "${HELM_PLUGINS:-$HOME/.local/share/helm/plugins}/helm-git" ]; then
            helm plugin install https://github.com/aslafy-z/helm-git --verify=false
          fi
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  terraform-docs-check:
    name: Terraform docs (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Install terraform-docs
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp
          sudo mv /tmp/terraform-docs /usr/local/bin/
      - name: Regenerate docs
        run: make tf-docs
      - name: Fail if docs are stale
        run: |
          if ! git diff --exit-code; then
            echo "::error::terraform-docs output is stale — run 'make tf-docs' and commit the result"
            exit 1
          fi
