apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: testbed-tests
    files:
      - pytest.ini=pytest.ini
      - conftest.py=conftest.py
      - probe_teapot_auth.py=probe_teapot_auth.py
      - test_rucio_deletion.py=test_rucio_deletion.py
      - test_rucio_transfers_with_copernicus.py=test_rucio_transfers_with_copernicus.py
      - test_rucio_transfers.py=test_rucio_transfers.py
generatorOptions:
  disableNameSuffixHash: true
