# Rooted here deliberately, not under deploy/gitops/ — Kustomize's
# security model restricts secretGenerator's files: sources to stay
# within the Kustomization's OWN root directory (unlike resources:
# entries, which can traverse arbitrary relative paths — the normal
# base/overlay composition pattern). shared/ and deploy/ are sibling
# top-level directories, so no Kustomization under deploy/gitops/ can
# ever legally read these files directly via files: — it has to live
# here instead, and get pulled in as a base via resources:.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
secretGenerator:
  - name: testbed-patches
    files:
      - fts--JobBuilder.py=fts/JobBuilder.py
      - fts--cloud.py=fts/cloud.py
      - fts--cloudStorage.py=fts/cloudStorage.py
      - fts--middleware.py=fts/middleware.py
      - fts--openidconnect.py=fts/openidconnect.py
      - fts--tokenproviders.py=fts/tokenproviders.py
      - rucio--constants.py=rucio/constants.py
      - rucio--fts3.py=rucio/fts3.py
      - rucio--oidc.py=rucio/oidc.py
      - rucio--rse.py=rucio/rse.py
generatorOptions:
  disableNameSuffixHash: true
