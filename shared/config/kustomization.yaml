# Rooted here deliberately, not under deploy/gitops/ — same reason as
# shared/patches/kustomization.yaml: Kustomize's default load-restrictor
# keeps configMapGenerator's files: sources within the Kustomization's
# OWN root directory. sandbox needs files from fts/, xrootd/, AND
# teapot/ — the only directory that's an ancestor of all three is
# shared/config/ itself, so the generator has to live here, not in a
# per-environment subdirectory (that's what broke under ArgoCD's default
# strict load-restrictor: a configs/kustomization.yaml one level below
# environments/sandbox/ reaching up into shared/config/ violated it —
# Flux's kustomize-controller defaults to the permissive restrictor, so
# it built fine there and never caught this).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: testbed-configs
    files:
      - gfal2_http_plugin.conf=fts/gfal2_http_plugin.conf
      - authdb=xrootd/authdb
      - scitokens.conf=xrootd/scitokens.conf
      - xrdrucio-scitokens.cfg=xrootd/xrdrucio-scitokens.cfg
      - config.ini=teapot/config.ini
      - user-mapping.csv=teapot/user-mapping.csv
      - logback.xml=teapot/logback.xml
      - application.yml=teapot/application.yml
      - data.properties=teapot/data.properties
    options:
      disableNameSuffixHash: true
