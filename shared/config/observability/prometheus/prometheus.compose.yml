# Prometheus scrape config for Docker Compose (design-doc-005, phase 1).
# Job names (rucio-server, rucio-daemons, fts, rucio-db) are shared with the Kubernetes
# scrape config, alerts, dashboard and tests.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rucio-server
    # Needs `metrics` in [api] endpoints of rucio.cfg.
    metrics_path: /metrics/
    # Rucio's Flask view sends text/html, which Prometheus 3 rejects otherwise.
    fallback_scrape_protocol: PrometheusText0.0.4
    # Direct-mode --run-once daemons leave many multiprocess files to aggregate.
    scrape_timeout: 30s
    scrape_interval: 30s
    static_configs:
      - targets: ["rucio-server:80"]

  - job_name: rucio-daemons
    # Multiprocess exporter, only running with DAEMON_MODE=daemons. DNS
    # discovery yields no target when the container is absent (direct mode).
    dns_sd_configs:
      - names: [rucio-daemons-metrics]
        type: A
        port: 8080

  - job_name: fts
    # sql_exporter over the FTS database (t_file).
    static_configs:
      - targets: ["fts-exporter:9399"]

  - job_name: rucio-db
    # sql_exporter over the Rucio database (rules, requests, heartbeats).
    static_configs:
      - targets: ["rucio-db-exporter:9399"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
