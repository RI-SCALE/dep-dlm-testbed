# Basic alert rules (design-doc-005: alerting beyond basics is a non-goal).
# Shared by Compose (rule_files) and Kubernetes (PrometheusRule wrapper).
# No Alertmanager in the Compose stack: alerts show in the Prometheus UI.
groups:
  - name: dep-dlm-rucio
    rules:
      - alert: RucioServerDown
        expr: up{job="rucio-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "rucio-server metrics endpoint unreachable"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 2 minutes."

      - alert: RucioDaemonsMetricsDown
        # Fires in DAEMON_MODE=direct too, where no daemons run; expected there.
        expr: up{job="rucio-daemons"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rucio daemon metrics unavailable"
          description: "No metrics from {{ $labels.instance }} for 5 minutes."

      - alert: RucioDbMetricsDown
        expr: up{job="rucio-db"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rucio database metrics unavailable"
          description: "rucio-db-exporter cannot query the Rucio database for 5 minutes."

      - alert: RucioRulesStuck
        expr: sum(rucio_rules{state="STUCK"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rucio has stuck replication rules"
          description: "{{ $value }} rules are STUCK; check rule errors and FTS failure reasons."

      - alert: FtsMetricsDown
        expr: up{job="fts"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "FTS database metrics unavailable"
          description: "fts-exporter cannot query the FTS database for 5 minutes."

      - alert: FtsSubmissionFailures
        expr: sum(increase(rucio_transfertool_fts3_submission_total{state="failure"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Rucio failed to submit transfers to FTS"
          description: "{{ $value }} file submissions to FTS failed in the last 15 minutes."

      - alert: FtsTransferFailureRatioHigh
        expr: |
          sum by (source_se, dest_se) (fts_files_completed_1h{state="FAILED"})
            / sum by (source_se, dest_se) (fts_files_completed_1h) > 0.2
          and sum by (source_se, dest_se) (fts_files_completed_1h) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High FTS failure ratio on {{ $labels.source_se }} -> {{ $labels.dest_se }}"
          description: "{{ $value | humanizePercentage }} of transfers on this link failed in the last hour."
