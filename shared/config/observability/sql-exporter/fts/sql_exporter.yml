# sql_exporter for the FTS database (design-doc-005). FTS has no Prometheus
# endpoint; its transfer state lives in MySQL (t_file), so we query it.
global:
  scrape_timeout: 10s
  min_interval: 15s
  max_connections: 2
  max_idle_connections: 1

target:
  # Compose test credentials, same as the ftsdb service. Kubernetes reads the
  # DSN from a secret instead.
  data_source_name: "mysql://fts:fts@ftsdb:3306/fts"
  collectors: [fts]

collector_files:
  - "*.collector.yml"
