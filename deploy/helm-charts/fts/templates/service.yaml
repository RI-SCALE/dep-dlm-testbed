apiVersion: v1
kind: Service
metadata:
  name: {{ include "fts.fullname" . }}
  labels:
    app: {{ include "fts.name" . }}
    instance: {{ include "fts.fullname" . }}
    release: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.rest }}
      targetPort: rest
      protocol: TCP
      name: rest
      appProtocol: HTTPS
    - port: {{ .Values.service.ports.monitoring }}
      targetPort: monitoring
      protocol: TCP
      name: monitoring
  selector:
    app: {{ include "fts.name" . }}
    instance: {{ include "fts.fullname" . }}
