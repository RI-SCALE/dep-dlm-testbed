image:
  repository: mgajekcern/test-fts
  tag: latest
  pullPolicy: IfNotPresent

fullnameOverride: ""

service:
  type: ClusterIP
  ports:
    # FTS REST API
    rest: 8446
    # FTS monitoring
    monitoring: 8449
  annotations: {}

# Optional MySQL StatefulSet co-located with the FTS server.
# The umbrella enables one ftsdb per FTS instance.
ftsdb:
  enabled: false
  hostname: ftsdb
  image: mysql:8
  storage: 2Gi
  resources: {}

volumes: []
volumeMounts: []

env: []

resources: {}

healthcheck:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
