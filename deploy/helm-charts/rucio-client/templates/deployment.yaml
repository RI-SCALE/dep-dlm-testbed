apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rucio-client.fullname" . }}
  labels:
    app: {{ include "rucio-client.name" . }}
    release: {{ .Release.Name }}
    {{- include "rucio-client.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "rucio-client.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "rucio-client.name" . }}
        release: {{ .Release.Name }}
        {{- include "rucio-client.labels" . | nindent 8 }}
    spec:
      hostname: {{ include "rucio-client.fullname" . }}
      serviceAccountName: {{ include "rucio-client.fullname" . }}
      containers:
        - name: client
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sleep", "infinity"]
          env:
            {{- with .Values.env }}
            {{- range . }}
            - name: {{ .name }}
              value: {{ .value }}
            {{- end }}
            {{- end }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            {{- range $mount := .Values.volumeMounts }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.mountPath }}
              {{- if hasKey $mount "subPath" }}
              subPath: {{ tpl $mount.subPath $ }}
              {{- end }}
              {{- if hasKey $mount "readOnly" }}
              readOnly: {{ $mount.readOnly }}
              {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- tpl (toYaml .Values.volumes) $ | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
