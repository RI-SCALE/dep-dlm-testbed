{{- /*
  Bootstrap Jobs for the two Rucio servers.

  Each Job runs `bootstrap-db.py` against its respective Postgres backend
  (ruciodb) once per `helm install` / `helm upgrade`, with
  helm.sh/hook annotations so it's run before the rucio Deployments start
  serving traffic. Idempotent: bootstrap-db.py handles "schema exists"
  gracefully.
*/}}

{{- if (index .Values "rucio-server" "enabled") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: rucio-bootstrap-db
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: "{{ index .Values "rucio-server" "image" "repository" }}:{{ index .Values "rucio-server" "image" "tag" }}"
          imagePullPolicy: "IfNotPresent"
          command:
            - bash
            - -c
            - |
              set -e
              # Wait until ruciodb's Postgres port answers.
              cp -r /policy-package/rucio_opa_v5_policy /tmp/rucio-opa-v5-policy
              pip install -q --force-reinstall --no-deps /tmp/rucio-opa-v5-policy
              for i in $(seq 1 30); do
                if python3 -c "import socket; socket.create_connection(('${DB_HOST}', 5432), timeout=2).close()" 2>/dev/null; then
                  echo "  ✓ ${DB_HOST} reachable"
                  break
                fi
                echo "  [$i] waiting for ${DB_HOST}..."
                sleep 5
              done
              python3 /scripts/rucio--bootstrap-db.py
          env:
            - name: DB_HOST
              value: ruciodb
          volumeMounts:
            - name: rucio-cfg
              mountPath: /opt/rucio/etc/rucio.cfg
              subPath: server.cfg
            - name: rucio-cfg
              mountPath: /opt/rucio/etc/alembic.ini
              subPath: alembic.ini
            - name: rucio-cfg
              mountPath: /opt/rucio/etc/idpsecrets.json
              subPath: idpsecrets.json
            - name: bootstrap
              mountPath: /scripts
            - name: policy-pyproject
              mountPath: /policy-package/rucio_opa_v5_policy/pyproject.toml
              subPath: rucio--rucio_opa_v5_policy--pyproject.toml
            - name: policy-init
              mountPath: /policy-package/rucio_opa_v5_policy/src/rucio_opa_v5_policy/__init__.py
              subPath: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--__init__.py
            - name: policy-client
              mountPath: /policy-package/rucio_opa_v5_policy/src/rucio_opa_v5_policy/opa_client.py
              subPath: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--opa_client.py
            - name: policy-permission
              mountPath: /policy-package/rucio_opa_v5_policy/src/rucio_opa_v5_policy/permission.py
              subPath: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--permission.py
      volumes:
        - name: rucio-cfg
          secret:
            secretName: testbed-secrets
        - name: bootstrap
          configMap:
            name: testbed-scripts
            defaultMode: 0755
        - name: policy-pyproject
          configMap:
            name: testbed-patches
            items:
              - key: rucio--rucio_opa_v5_policy--pyproject.toml
                path: rucio--rucio_opa_v5_policy--pyproject.toml
        - name: policy-init
          configMap:
            name: testbed-patches
            items:
              - key: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--__init__.py
                path: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--__init__.py
        - name: policy-client
          configMap:
            name: testbed-patches
            items:
              - key: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--opa_client.py
                path: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--opa_client.py
        - name: policy-permission
          configMap:
            name: testbed-patches
            items:
              - key: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--permission.py
                path: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--permission.py
{{- end }}
