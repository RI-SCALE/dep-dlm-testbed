{{- if .Values.configs.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configs.configMapName }}
  labels:
    app.kubernetes.io/name: dep-dlm-testbed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  {{- /*
    Only top-level files per service directory go into the flat/default
    ConfigMap (files/configs/<service>/<file>), keyed by basename — this is
    what every subchart's plain subPath: <name> assumes. Files under a
    second-level profile directory (e.g. files/configs/rucio/egi-dev/*) are
    intentionally excluded here to avoid basename collisions with the
    default file of the same name; see the per-profile ConfigMap below.
  */}}
  {{- range $path, $_ := .Files.Glob "files/configs/*/*" }}
    {{- $rel := trimPrefix "files/configs/" $path }}
    {{- if not (regexMatch "^[^/]+/[^/]+/" $rel) }}
      {{- $name := base $path }}
  {{ $name }}: |-
{{ $.Files.Get $path | indent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
---
{{- if .Values.configs.create }}
{{- /*
  Profile-specific overrides (e.g. egi-dev), one ConfigMap per profile
  subdirectory found under files/configs/<service>/<profile>/. Keyed by
  basename same as the default map, so a subchart can swap which ConfigMap
  it mounts (default vs profile) without changing subPath names.
*/}}
{{- range $profile := list "egi-dev" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.configs.configMapName }}-{{ $profile }}
  labels:
    app.kubernetes.io/name: dep-dlm-testbed
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  {{- $merged := dict }}
  {{- range $path, $_ := $.Files.Glob "files/configs/*/*" }}
    {{- $rel := trimPrefix "files/configs/" $path }}
    {{- if not (regexMatch "^[^/]+/[^/]+/" $rel) }}
      {{- $_ := set $merged (base $path) $path }}
    {{- end }}
  {{- end }}
  {{- range $path, $_ := $.Files.Glob (printf "files/configs/*/%s/*" $profile) }}
    {{- $_ := set $merged (base $path) $path }}
  {{- end }}
  {{- range $name, $path := $merged }}
  {{ $name }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}