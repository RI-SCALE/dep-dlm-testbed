  env:
    - name: REQUESTS_CA_BUNDLE
      value: /etc/pki/tls/certs/ca-bundle.crt

  volumes:
    - name: certs
      secret:
        secretName: testbed-certs
        defaultMode: 0600

    - name: secrets
      secret:
        secretName: testbed-secrets
        defaultMode: 0600

    - name: scripts
      configMap:
        name: testbed-scripts
        defaultMode: 0755

    - name: tests
      configMap:
        name: testbed-tests
        defaultMode: 0755

  volumeMounts:
    - name: certs
      mountPath: /etc/grid-security/hostcert.pem
      subPath: hostcert.pem
      readOnly: true
    - name: certs
      mountPath: /etc/grid-security/hostkey.pem
      subPath: hostkey.pem
      readOnly: true
    - name: certs
      mountPath: /etc/grid-security/certificates/tls_ca_bundle.pem
      subPath: certificates/tls_ca_bundle.pem
      readOnly: true
    - name: certs
      mountPath: /etc/grid-security/certificates/5fca1cb1.0
      subPath: rucio_ca.pem
      readOnly: true
    - name: certs
      mountPath: /etc/grid-security/certificates/rucio_ca.pem
      subPath: rucio_ca.pem
      readOnly: true
    - name: secrets
      mountPath: /opt/rucio/etc/rucio.cfg
      subPath: userpass-client.cfg
      readOnly: true
    - name: scripts
      mountPath: /scripts
      readOnly: true
    - name: tests
      mountPath: /tests
      readOnly: true

# Teapot pod

teapot1:
  enabled: true
  fullnameOverride: teapot1

  volumes:
    - name: certs
      secret:
        secretName: testbed-certs
        defaultMode: 0600
        items:
          - key: teapot1cert.pem
            path: teapot1cert.pem
            mode: 0600

          - key: teapot1key.pem
            path: teapot1key.pem
            mode: 0600

          - key: storm-webdav-localhostcert.pem
            path: storm-webdav-localhostcert.pem
            mode: 0644

          - key: storm-webdav-localhostkey.pem
            path: storm-webdav-localhostkey.pem
            mode: 0644

          - key: rucio_ca.pem
            path: rucio_ca.pem
            mode: 0644

    - name: trust
      secret:
        secretName: testbed-certs
        items:
          - key: tls_ca_bundle.pem
            path: tls_ca_bundle.pem

          - key: rucio_ca.pem
            path: 5fca1cb1.0

          - key: rucio_ca.pem
            path: b96dc756.0

          - key: 5fca1cb1.signing_policy
            path: 5fca1cb1.signing_policy

          - key: b96dc756.signing_policy
            path: b96dc756.signing_policy

    - name: configs
      configMap:
        name: testbed-configs

    - name: patches
      configMap:
        name: testbed-patches

    - name: teapot-data
      persistentVolumeClaim:
        claimName: teapot1-data

  volumeMounts:
    # Teapot config files
    - name: configs
      mountPath: /etc/teapot/config.ini
      subPath: config.ini
      readOnly: true
    - name: configs
      mountPath: /etc/teapot/user-mapping.csv
      subPath: user-mapping.csv
      readOnly: true
    - name: configs
      mountPath: /etc/teapot/logback.xml
      subPath: logback.xml
      readOnly: true
    # Teapot TLS cert + key
    - name: certs
      mountPath: /var/lib/teapot/webdav/teapot.crt
      subPath: teapot1cert.pem
    - name: certs
      mountPath: /var/lib/teapot/webdav/teapot.key
      subPath: teapot1key.pem
    # Rucio CA (Teapot-testing CA + system trust)
    - name: certs
      mountPath: /var/lib/teapot/webdav/Teapot-testing.crt
      subPath: rucio_ca.pem
    - name: certs
      mountPath: /usr/local/share/ca-certificates/rucio-ca.crt
      subPath: rucio_ca.pem
    # Storm-WebDAV internal TLS
    - name: certs
      mountPath: /etc/storm/webdav/localhost.crt
      subPath: storm-webdav-localhostcert.pem
    - name: certs
      mountPath: /etc/storm/webdav/localhost.key
      subPath: storm-webdav-localhostkey.pem
    # canl trust anchors
    - name: trust
      mountPath: /etc/grid-security/certificates
      readOnly: true
    # Storm-WebDAV application.yml + storage area
    - name: configs
      mountPath: /var/lib/teapot/user-teapot/config/application.yml
      subPath: application.yml
      readOnly: true
    - name: configs
      mountPath: /var/lib/teapot/user-teapot/sa.d/data.properties
      subPath: data.properties
      readOnly: true
    # Patched teapot.py
    - name: patches
      mountPath: /usr/share/teapot/teapot.py
      subPath: teapot--teapot.py
      readOnly: true

teapot2:
  enabled: true
  fullnameOverride: teapot2

  volumes:
    - name: certs
      secret:
        secretName: testbed-certs
        defaultMode: 0600
        items:
          - key: teapot2cert.pem
            path: teapot2cert.pem
            mode: 0600

          - key: teapot2key.pem
            path: teapot2key.pem
            mode: 0600

          - key: storm-webdav-localhostcert.pem
            path: storm-webdav-localhostcert.pem
            mode: 0644

          - key: storm-webdav-localhostkey.pem
            path: storm-webdav-localhostkey.pem
            mode: 0644

          - key: rucio_ca.pem
            path: rucio_ca.pem
            mode: 0644

    - name: trust
      secret:
        secretName: testbed-certs
        items:
          - key: tls_ca_bundle.pem
            path: tls_ca_bundle.pem

          - key: rucio_ca.pem
            path: 5fca1cb1.0

          - key: rucio_ca.pem
            path: b96dc756.0

          - key: 5fca1cb1.signing_policy
            path: 5fca1cb1.signing_policy

          - key: b96dc756.signing_policy
            path: b96dc756.signing_policy

    - name: configs
      configMap:
        name: testbed-configs

    - name: patches
      configMap:
        name: testbed-patches

    - name: teapot-data
      persistentVolumeClaim:
        claimName: teapot2-data

  volumeMounts:
    # Teapot config files
    - name: configs
      mountPath: /etc/teapot/config.ini
      subPath: config.ini
      readOnly: true
    - name: configs
      mountPath: /etc/teapot/user-mapping.csv
      subPath: user-mapping.csv
      readOnly: true
    - name: configs
      mountPath: /etc/teapot/logback.xml
      subPath: logback.xml
      readOnly: true
    # Teapot TLS cert + key
    - name: certs
      mountPath: /var/lib/teapot/webdav/teapot.crt
      subPath: teapot2cert.pem
    - name: certs
      mountPath: /var/lib/teapot/webdav/teapot.key
      subPath: teapot2key.pem
    # Rucio CA (Teapot-testing CA + system trust)
    - name: certs
      mountPath: /var/lib/teapot/webdav/Teapot-testing.crt
      subPath: rucio_ca.pem
    - name: certs
      mountPath: /usr/local/share/ca-certificates/rucio-ca.crt
      subPath: rucio_ca.pem
    # Storm-WebDAV internal TLS
    - name: certs
      mountPath: /etc/storm/webdav/localhost.crt
      subPath: storm-webdav-localhostcert.pem
    - name: certs
      mountPath: /etc/storm/webdav/localhost.key
      subPath: storm-webdav-localhostkey.pem
    # canl trust anchors
    - name: trust
      mountPath: /etc/grid-security/certificates
      readOnly: true
    # Storm-WebDAV application.yml + storage area
    - name: configs
      mountPath: /var/lib/teapot/user-teapot/config/application.yml
      subPath: application.yml
      readOnly: true
    - name: configs
      mountPath: /var/lib/teapot/user-teapot/sa.d/data.properties
      subPath: data.properties
      readOnly: true
    # Patched teapot.py
    - name: patches
      mountPath: /usr/share/teapot/teapot.py
      subPath: teapot--teapot.py
      readOnly: true
