# ============================================================================
# dep-dlm-testbed — umbrella values
# ============================================================================
# This file is the single source of truth for the testbed. Each top-level key
# below corresponds to a dependency alias in Chart.yaml and is passed directly
# to that subchart as its .Values.
#
# Shared resources are created by templates in this chart and consumed
# by all subcharts, e.g.:
#   - Secret      "testbed-certs"   (all PEMs)
#   - ConfigMap   "testbed-configs" (all non-secret config files)
#   - Secret      "testbed-secrets" (realm.json, userpass-client.cfg,
#                                     server.cfg, alembic.ini, idpsecrets.json
#                                     — see docs/design/design-doc-002)
#   - ConfigMap   "testbed-scripts" (all entrypoint/test scripts)
#
# These are populated from files/ under this chart. See README.md for how to
# place your source tree before running `helm install`.

# Options: unmanaged, managed
global:
  tokenMode: managed
  daemonMode: direct
  scopeProfile: local

certs:
  create: true
  secretName: testbed-certs
  files:
    hostcert.pem: ""
    hostkey.pem: ""
    hostcert_with_key.pem: ""
    rucio_ca.pem: ""
    xrdcert.pem: ""
    xrdkey.pem: ""
    keycloakcert.pem: ""
    keycloakkey.pem: ""
    teapot1cert.pem: ""
    teapot1key.pem: ""
    teapot2cert.pem: ""
    teapot2key.pem: ""
    tls_ca_bundle.pem: ""
    5fca1cb1.0: ""
    b96dc756.0: ""
    5fca1cb1.signing_policy: ""
    b96dc756.signing_policy: ""

configs:
  create: true
secrets:
  create: true
scripts:
  create: true
patches:
  create: true
tests:
  create: true

# DATABASES

ruciodb:
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
  enabled: true
  fullnameOverride: ruciodb
  auth: { username: rucio, password: rucio, database: rucio }
  primary:
    persistence:
      enabled: true
      size: 2Gi


# Rucio Server

"rucio-server":
  enabled: true
  fullnameOverride: rucio-server
  replicaCount: 1
  image:
    repository: rucio/rucio-server
    tag: release-41.2.1
    pullPolicy: IfNotPresent
  useSSL: false
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  useDeprecatedImplicitSecrets: false

  lifecycle:
    postStart:
      exec:
        command:
          - /bin/bash
          - -c
          - |
            update-ca-trust extract
            dnf -y install yum-utils epel-release.noarch &&
            dnf install -y --exclude=globus-gssapi-gsi gfal2-all python3-gfal2 \
              python3-gfal2-util gfal2-plugin-http --skip-broken ||
            echo "gfal2 install failed"
  additionalEnvs:
    - name: REQUESTS_CA_BUNDLE
      value: /etc/pki/tls/certs/ca-bundle.crt

  secretMounts:
    # Same directory mount as the GSI server
    - secretFullName: testbed-certs
      volumeName: certs-grid
      mountPath: /etc/grid-security
      defaultMode: 0600
      items:
        - { key: hostcert.pem,          path: hostcert.pem, mode: 0644 }
        - { key: hostkey.pem,           path: hostkey.pem, mode: 0600 }
        - { key: hostcert_with_key.pem, path: hostcert_with_key.pem, mode: 0600 }
        - { key: rucio_ca.pem,          path: certificates/rucio_ca.pem, mode: 0644 }
        - { key: rucio_ca.pem,          path: certificates/5fca1cb1.0, mode: 0644 }
        - { key: tls_ca_bundle.pem,     path: certificates/tls_ca_bundle.pem, mode: 0644 }

    - secretFullName: testbed-secrets
      volumeName: rucio-cfg-server
      mountPath: /opt/rucio/etc/rucio.cfg
      subPath: server.cfg
    - secretFullName: testbed-secrets
      volumeName: rucio-cfg-alembic
      mountPath: /opt/rucio/etc/alembic.ini
      subPath: alembic.ini
    - secretFullName: testbed-secrets
      volumeName: rucio-cfg-idpsecrets
      mountPath: /opt/rucio/etc/idpsecrets.json
      subPath: idpsecrets.json

  configMounts:
    # Python patches
    - configMapFullName: testbed-patches
      volumeName: fts3-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/transfertool/fts3.py
      subPath: rucio--fts3.py
    - configMapFullName: testbed-patches
      volumeName: oidc-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/core/oidc.py
      subPath: rucio--oidc.py
    - configMapFullName: testbed-patches
      volumeName: constants-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/common/constants.py
      subPath: rucio--constants.py
    - configMapFullName: testbed-patches
      volumeName: rse-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/core/rse.py
      subPath: rucio--rse.py


rucio-daemons:
  enabled: false
  fullnameOverride: rucio-daemons
  image:
    repository: rucio/rucio-daemons
    tag: release-41.2.1
    pullPolicy: IfNotPresent

  lifecycle:
    postStart:
      exec:
        command:
          - /bin/bash
          - -c
          - |
            update-ca-trust extract
            dnf -y install yum-utils epel-release.noarch &&
            dnf install -y --exclude=globus-gssapi-gsi gfal2-all python3-gfal2 \
              python3-gfal2-util gfal2-plugin-http --skip-broken ||
            echo "gfal2 install failed"

  # Enable the daemons the testbed needs
  conveyorTransferSubmitterCount: 1
  conveyorPollerCount: 1
  conveyorFinisherCount: 1
  judgeEvaluatorCount: 1
  judgeCleanerCount: 1
  reaperCount: 1

  # Fast cadence + correct activity so the testbed converges within the
  # test timeout. The chart defaults activities to "'test1' 'test2'", which
  # would starve our default-activity rules; clear it so all activities run.
  conveyorTransferSubmitter:
    threads: 1
    sleepTime: 5
    activities: ""
    resources:
      requests: { memory: "512Mi", cpu: "100m" }
      limits:   { memory: "1Gi",   cpu: "500m" }
  conveyorPoller:
    threads: 1
    sleepTime: 5
    resources:
      requests: { memory: "512Mi", cpu: "100m" }
      limits:   { memory: "1Gi",   cpu: "500m" }
  conveyorFinisher:
    threads: 1
    sleepTime: 5
    resources:
      requests: { memory: "512Mi", cpu: "100m" }
      limits:   { memory: "1Gi",   cpu: "500m" }
  judgeEvaluator:
    threads: 1
    sleepTime: 5
    resources:
      requests: { memory: "512Mi", cpu: "100m" }
      limits:   { memory: "1Gi",   cpu: "500m" }
  judgeCleaner:
    threads: 1
    sleepTime: 5
    resources:
      requests: { memory: "512Mi", cpu: "100m" }
      limits:   { memory: "1Gi",   cpu: "500m" }
  reaper:
    greedy: 1
    threads: 1
    sleepTime: 5
    resources:
      requests: { memory: "512Mi", cpu: "100m" }
      limits:   { memory: "1Gi",   cpu: "500m" }

  useDeprecatedImplicitSecrets: false

  additionalEnvs:
    - name: REQUESTS_CA_BUNDLE
      value: /etc/pki/tls/certs/ca-bundle.crt

  secretMounts:
    - secretFullName: testbed-certs
      volumeName: certs-grid
      mountPath: /etc/grid-security
      defaultMode: 0600
      items:
        - { key: hostcert.pem,          path: hostcert.pem, mode: 0644 }
        - { key: hostkey.pem,           path: hostkey.pem, mode: 0600 }
        - { key: hostcert_with_key.pem, path: hostcert_with_key.pem, mode: 0600 }
        - { key: rucio_ca.pem,          path: certificates/rucio_ca.pem, mode: 0644 }
        - { key: rucio_ca.pem,          path: certificates/5fca1cb1.0, mode: 0644 }
        - { key: tls_ca_bundle.pem,     path: certificates/tls_ca_bundle.pem, mode: 0644 }

    - secretFullName: testbed-secrets
      volumeName: rucio-cfg-server
      mountPath: /opt/rucio/etc/rucio.cfg
      subPath: server.cfg
    - secretFullName: testbed-secrets
      volumeName: rucio-cfg-alembic
      mountPath: /opt/rucio/etc/alembic.ini
      subPath: alembic.ini
    - secretFullName: testbed-secrets
      volumeName: rucio-cfg-idpsecrets
      mountPath: /opt/rucio/etc/idpsecrets.json
      subPath: idpsecrets.json

  configMounts:
    - configMapFullName: testbed-patches
      volumeName: fts3-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/transfertool/fts3.py
      subPath: rucio--fts3.py
    - configMapFullName: testbed-patches
      volumeName: oidc-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/core/oidc.py
      subPath: rucio--oidc.py
    - configMapFullName: testbed-patches
      volumeName: constants-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/common/constants.py
      subPath: rucio--constants.py
    - configMapFullName: testbed-patches
      volumeName: rse-patch
      mountPath: /usr/local/lib/python3.9/site-packages/rucio/core/rse.py
      subPath: rucio--rse.py

# FTS

fts:
  enabled: true
  fullnameOverride: fts
  ftsdb:
    enabled: true
    hostname: ftsdb

  env:
    - name: REQUESTS_CA_BUNDLE
      value: /etc/pki/tls/certs/ca-bundle.crt

  volumes:
    - name: certs
      secret:
        secretName: testbed-certs
        defaultMode: 0600
        items:
          - key: hostcert.pem
            path: hostcert.pem
            mode: 0600

          - key: hostkey.pem
            path: hostkey.pem
            mode: 0600

          - key: rucio_ca.pem
            path: rucio_ca.pem
            mode: 0644

          - key: tls_ca_bundle.pem
            path: tls_ca_bundle.pem
            mode: 0644

          - key: 5fca1cb1.0
            path: 5fca1cb1.0
            mode: 0644

          - key: 5fca1cb1.signing_policy
            path: 5fca1cb1.signing_policy
            mode: 0644

          - key: b96dc756.0
            path: b96dc756.0
            mode: 0644

          - key: b96dc756.signing_policy
            path: b96dc756.signing_policy
            mode: 0644

    - name: secrets
      secret:
        secretName: testbed-secrets

    - name: scripts
      configMap:
        name: testbed-scripts
        defaultMode: 0755

    - name: configs
      configMap:
        name: testbed-configs

    - name: patches
      configMap:
        name: testbed-patches

  volumeMounts:
    # Certs
    - name: certs
      mountPath: /etc/grid-security/hostcert.pem
      subPath: hostcert.pem
    - name: certs
      mountPath: /etc/grid-security/hostkey.pem
      subPath: hostkey.pem
    - name: certs
      mountPath: /etc/grid-security/certificates/tls_ca_bundle.pem
      subPath: certificates/tls_ca_bundle.pem
    - name: certs
      mountPath: /etc/grid-security/certificates/5fca1cb1.0
      subPath: 5fca1cb1.0
    - name: certs
      mountPath: /etc/grid-security/certificates/5fca1cb1.signing_policy
      subPath: 5fca1cb1.signing_policy
    - name: certs
      mountPath: /etc/grid-security/certificates/b96dc756.0
      subPath: b96dc756.0
    - name: certs
      mountPath: /etc/grid-security/certificates/b96dc756.signing_policy
      subPath: b96dc756.signing_policy
    - name: certs
      mountPath: /etc/pki/ca-trust/source/anchors/rucio-ca.crt
      subPath: rucio_ca.pem
      readOnly: false

    - name: secrets
      mountPath: /etc/fts3/fts3config
      subPath: fts3config

    - name: secrets
      mountPath: /etc/fts3/fts3restconfig
      subPath: fts3restconfig

    # Scripts directory
    - name: scripts
      mountPath: /scripts

    # FTS configs (token-mode conditional for fts3restconfig)
    - name: configs
      mountPath: /etc/gfal2.d/http_plugin.conf
      subPath: gfal2_http_plugin.conf

    # Entrypoint
    - name: scripts
      mountPath: /docker-entrypoint.sh
      subPath: fts--docker-entrypoint.sh

    # Python patches for fts-rest-flask
    - name: patches
      mountPath: /tmp/fts-rest-flask/src/fts3rest/fts3rest/config/middleware.py
      subPath: fts--middleware.py
    - name: patches
      mountPath: /tmp/fts-rest-flask/src/fts3rest/fts3rest/lib/openidconnect.py
      subPath: fts--openidconnect.py
    - name: patches
      mountPath: /tmp/fts-rest-flask/src/fts3rest/fts3rest/lib/JobBuilder.py
      subPath: fts--JobBuilder.py
    - name: patches
      mountPath: /tmp/fts-rest-flask/src/fts3rest/fts3rest/model/cloudStorage.py
      subPath: fts--cloudStorage.py
    - name: patches
      mountPath: /tmp/fts-rest-flask/src/fts3rest/fts3rest/controllers/config/cloud.py
      subPath: fts--cloud.py
    - name: patches
      mountPath: /tmp/fts-rest-flask/src/fts3rest/fts3rest/controllers/config/tokenproviders.py
      subPath: fts--tokenproviders.py

# Keycloak

keycloak:
  enabled: true
  fullnameOverride: keycloak

  volumes:
    - name: certs
      secret:
        secretName: testbed-certs

    - name: secrets
      secret:
        secretName: testbed-secrets

  volumeMounts:
    - name: certs
      mountPath: /etc/x509/https/keycloakcert.pem
      subPath: keycloakcert.pem
      readOnly: true

    - name: certs
      mountPath: /etc/x509/https/keycloakkey.pem
      subPath: keycloakkey.pem
      readOnly: true

    - name: secrets
      mountPath: /opt/keycloak/data/import/realm.json
      subPath: realm.json
      readOnly: true

# XRootD storage endpoints

