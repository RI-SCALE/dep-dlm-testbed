replicaCount: 1

image:
  repository: openpolicyagent/opa
  tag: "1.8.0-static"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "opa"   # rucio-server/rucio-daemons hardcode OPA_URL=http://opa:8181

service:
  type: ClusterIP
  port: 8181

livenessProbe:
  httpGet: { path: /health, port: http }
readinessProbe:
  httpGet: { path: /health, port: http }

resources: {}

volumes: []
volumeMounts: []

# Appended to the default `opa run --server …` args, e.g. paths to load at
# start-up. Set `args` instead to replace the defaults entirely.
extraArgs: []
args: []
