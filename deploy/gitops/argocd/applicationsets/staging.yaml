# ============================================================================
# DEP DLM — ApplicationSet (staging)
# ============================================================================
# Subset: omits vault (external), postgresql (external DB), keycloak/xrootd/
# teapot (external IdP+storage). FIX: hasKey guard + no missingkey=error.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dep-dlm-staging
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elementsYaml: |
          - name: external-secrets
            spec:
              source:
                repoURL: https://charts.external-secrets.io
                chart: external-secrets
                targetRevision: 0.10.7
                helm: { values: "installCRDs: true\n" }
          - name: rucio-server
            spec:
              sources:
                - repoURL: https://github.com/mgajek-cern/helm-charts.git
                  path: charts/rucio-server
                  targetRevision: master
                  helm: { valueFiles: ["$values/deploy/gitops/base/values/rucio-server.yaml"] }
                - repoURL: https://github.com/ri-scale/dep-dlm-testbed.git
                  targetRevision: feat/vendor-rucio-charts-from-fork
                  ref: values
          - name: rucio-daemons
            spec:
              sources:
                - repoURL: https://github.com/mgajek-cern/helm-charts.git
                  path: charts/rucio-daemons
                  targetRevision: master
                  helm: { valueFiles: ["$values/deploy/gitops/base/values/rucio-daemons.yaml", "$values/deploy/gitops/environments/staging/values/rucio-daemons.yaml"] }
                - repoURL: https://github.com/ri-scale/dep-dlm-testbed.git
                  targetRevision: feat/vendor-rucio-charts-from-fork
                  ref: values
          - name: fts
            spec:
              sources:
                - repoURL: https://github.com/ri-scale/dep-dlm-testbed.git
                  targetRevision: feat/vendor-rucio-charts-from-fork
                  path: deploy/helm-charts/fts
                  helm: { valueFiles: ["$values/deploy/gitops/base/values/fts.yaml", "$values/deploy/gitops/environments/staging/values/fts.yaml"] }
                - repoURL: https://github.com/ri-scale/dep-dlm-testbed.git
                  targetRevision: feat/vendor-rucio-charts-from-fork
                  ref: values
  template:
    metadata:
      name: '{{ .name }}-staging'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: dep-dlm-staging
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
  templatePatch: |
    spec:
      {{- if hasKey .spec "source" }}
      source:
        {{- toYaml .spec.source | nindent 8 }}
      {{- end }}
      {{- if hasKey .spec "sources" }}
      sources:
        {{- toYaml .spec.sources | nindent 8 }}
      {{- end }}
