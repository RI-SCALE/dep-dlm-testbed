---
apiVersion: v1
kind: Namespace
metadata:
  name: dep-dlm-sandbox
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-sandbox-eso, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/flux/eso
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-sandbox-core, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/flux/core/sandbox
  prune: true
  wait: true                      # Vault + postgresql Ready before seed/secrets
  timeout: 10m
  dependsOn:
    - { name: dep-dlm-sandbox-eso }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-sandbox-secrets, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/environments/sandbox
  prune: true
  targetNamespace: dep-dlm-sandbox
  wait: true                      # ExternalSecrets projected before bootstrap mounts them
  timeout: 10m
  dependsOn:
    - { name: dep-dlm-sandbox-core }   # Vault must be up + reachable for the seed
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-sandbox, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/flux/environments/sandbox
  prune: true
