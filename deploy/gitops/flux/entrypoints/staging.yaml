---
apiVersion: v1
kind: Namespace
metadata:
  name: dep-dlm-staging
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-staging-eso, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/flux/eso
  prune: true
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-staging-core, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/flux/core/staging
  prune: true
  wait: true                      # Vault + postgresql Ready before seed/secrets
  timeout: 10m
  dependsOn:
    - { name: dep-dlm-staging-eso }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-staging-secrets, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/environments/staging/secrets
  prune: true
  targetNamespace: dep-dlm-staging
  wait: true                      # ExternalSecrets projected before bootstrap mounts them
  timeout: 10m
  dependsOn:
    - { name: dep-dlm-staging-core }   # Vault must be up + reachable for the seed
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: { name: dep-dlm-staging, namespace: flux-system }
spec:
  interval: 5m
  sourceRef: { kind: GitRepository, name: dep-dlm-testbed }
  path: ./deploy/gitops/flux/environments/staging
  prune: true
  dependsOn:
    - { name: dep-dlm-staging-secrets }
