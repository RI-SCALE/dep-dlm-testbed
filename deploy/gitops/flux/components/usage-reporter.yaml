apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: usage-reporter
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  releaseName: usage-reporter
  targetNamespace: dep-dlm-PLACEHOLDER
  install: { createNamespace: true }
  dependsOn:
    - { name: external-secrets }
  chart:
    spec:
      chart: dep-dlm-usage-reporter
      version: "0.4.1"
      sourceRef: { kind: HelmRepository, name: ri-scale, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: usage-reporter-values
      valuesKey: usage-reporter.yaml
