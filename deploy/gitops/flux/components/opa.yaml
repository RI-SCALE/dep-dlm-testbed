apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opa
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: opa
  targetNamespace: dep-dlm-PLACEHOLDER
  install: { createNamespace: true }
  dependsOn:
    - { name: external-secrets }
  chart:
    spec:
      chart: opa
      version: "0.1.0"
      sourceRef: { kind: HelmRepository, name: ri-scale-dep-dlm, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: opa-values
      valuesKey: opa.yaml
