apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opa
  namespace: flux-system
spec:
  interval: 5m
  timeout: 20m
  releaseName: opa
  targetNamespace: dep-dlm-PLACEHOLDER
  install: { createNamespace: true }
  dependsOn:
    - { name: external-secrets }
  chart:
    spec:
      chart: deploy/helm-charts/opa
      sourceRef: { kind: GitRepository, name: dep-dlm-testbed, namespace: flux-system }
  valuesFrom:
    - kind: ConfigMap
      name: opa-values
      valuesKey: opa.yaml
