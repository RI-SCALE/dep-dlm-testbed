apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 5m
  releaseName: alloy
  targetNamespace: dep-dlm-PLACEHOLDER
  install: { createNamespace: true }
  dependsOn:
    - { name: loki }
  chart:
    spec:
      chart: alloy
      version: "0.10.1"
      sourceRef: { kind: HelmRepository, name: grafana, namespace: flux-system }
  valuesFrom:
    - { kind: ConfigMap, name: alloy-values, valuesKey: alloy.yaml }
