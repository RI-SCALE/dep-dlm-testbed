apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 5m
  timeout: 15m
  releaseName: kube-prometheus-stack     # service kube-prometheus-stack-prometheus (Makefile PROMETHEUS_URL)
  targetNamespace: dep-dlm-PLACEHOLDER
  install: { createNamespace: true, crds: CreateReplace }
  upgrade: { crds: CreateReplace }
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "68.4.0"
      sourceRef: { kind: HelmRepository, name: prometheus-community, namespace: flux-system }
  valuesFrom:
    - { kind: ConfigMap, name: kube-prometheus-stack-values, valuesKey: kube-prometheus-stack.yaml }
