apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 5m
  releaseName: observability
  targetNamespace: dep-dlm-PLACEHOLDER
  dependsOn:
    - { name: kube-prometheus-stack }    # PrometheusRule CRD
  chart:
    spec:
      chart: observability
      version: "0.1.0"
      sourceRef: { kind: HelmRepository, name: ri-scale-dep-dlm, namespace: flux-system }
  valuesFrom:
    - { kind: ConfigMap, name: observability-values, valuesKey: observability.yaml }
