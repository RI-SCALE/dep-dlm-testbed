apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 5m
  releaseName: loki                      # service loki (Makefile LOKI_URL)
  targetNamespace: dep-dlm-PLACEHOLDER
  install: { createNamespace: true }
  chart:
    spec:
      chart: loki
      version: "6.24.0"
      sourceRef: { kind: HelmRepository, name: grafana, namespace: flux-system }
  valuesFrom:
    - { kind: ConfigMap, name: loki-values, valuesKey: loki.yaml }
