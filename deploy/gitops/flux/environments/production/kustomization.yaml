apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# production components (external Vault/DB/IdP/storage; postgresql in db stage if local).
resources:
  - ../../sources/helmrepositories.yaml
  - ../../components/fts.yaml
  - ../../components/rucio-server.yaml
  - ../../components/rucio-daemons.yaml
configMapGenerator:
  - { name: rucio-server-values,  namespace: flux-system, files: [ rucio-server.yaml=../../../base/values/rucio-server.yaml ] }
  - { name: rucio-daemons-values, namespace: flux-system, files: [ rucio-daemons.yaml=../../../base/values/rucio-daemons.yaml ] }
  - { name: fts-values,           namespace: flux-system, files: [ fts.yaml=../../../base/values/fts.yaml ] }
  # Staging-specific overlays, layered on top of base via a second
  # valuesFrom entry (patches below) — same role as ArgoCD's second
  # entry in applicationsets/staging.yaml's helm.valueFiles list. Without
  # these, Flux only ever sees base/values/*.yaml: ftsdb stays enabled
  # (redundant in-cluster MySQL, competes for GCE quota) and the
  # b96dc756.* cert items (which don't exist in staging's scoped-down
  # testbed-certs) stay referenced, crashing the FTS mount.
  - { name: fts-overrides-values,           namespace: flux-system, files: [ fts.yaml=../../../environments/production/values/fts.yaml ] }
  - { name: rucio-daemons-overrides-values, namespace: flux-system, files: [ rucio-daemons.yaml=../../../environments/production/values/rucio-daemons.yaml ] }
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: { kind: HelmRelease }
    patch: |
      - op: replace
        path: /spec/targetNamespace
        value: dep-dlm-production
  - target: { kind: HelmRelease, name: fts }
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value: { kind: ConfigMap, name: fts-overrides-values, valuesKey: fts.yaml }
  - target: { kind: HelmRelease, name: rucio-daemons }
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value: { kind: ConfigMap, name: rucio-daemons-overrides-values, valuesKey: rucio-daemons.yaml }
  # rucio-server's dependsOn: postgresql (in components/rucio-server.yaml)
  # is sandbox-only — staging has no bundled postgresql HelmRelease at
  # all (real Cloud SQL instance from Terraform instead), so that
  # dependency could structurally never resolve. Confirmed live:
  # "unable to get 'flux-system/postgresql' dependency: helmreleases...
  # not found", permanently blocking rucio-server (and rucio-daemons
  # behind it, which correctly depends on rucio-server — that one stays,
  # it resolves naturally once rucio-server itself converges).
  - target: { kind: HelmRelease, name: rucio-server }
    patch: |
      - op: remove
        path: /spec/dependsOn
