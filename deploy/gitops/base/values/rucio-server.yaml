fullnameOverride: rucio-server
replicaCount: 1
image:
  repository: rucio/rucio-server
  tag: release-41.2.1
  pullPolicy: IfNotPresent
useSSL: false
service:
  type: ClusterIP
  port: 80
  targetPort: 80
useDeprecatedImplicitSecrets: false

lifecycle:
  postStart:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          update-ca-trust extract
          dnf -y install yum-utils epel-release.noarch &&
          dnf install -y --exclude=globus-gssapi-gsi gfal2-all python3-gfal2 \
            python3-gfal2-util gfal2-plugin-http --skip-broken ||
          echo "gfal2 install failed"

additionalEnvs:
  - name: REQUESTS_CA_BUNDLE
    value: /etc/pki/tls/certs/ca-bundle.crt
  - { name: OPA_URL,            value: http://opa:8181 }
  - { name: OPA_POLICY_PATH,    value: vo/authz/v5/allow }
  - { name: OPA_TIMEOUT,        value: "2" }

secretMounts:
  - secretFullName: testbed-certs
    volumeName: certs-grid
    mountPath: /etc/grid-security
    defaultMode: 0600
    items:
      - { key: hostcert.pem,          path: hostcert.pem, mode: 0644 }
      - { key: hostkey.pem,           path: hostkey.pem, mode: 0600 }
      - { key: hostcert_with_key.pem, path: hostcert_with_key.pem, mode: 0600 }
      - { key: rucio_ca.pem,          path: certificates/rucio_ca.pem, mode: 0644 }
      - { key: rucio_ca.pem,          path: certificates/5fca1cb1.0, mode: 0644 }
      - { key: tls_ca_bundle.pem,     path: certificates/tls_ca_bundle.pem, mode: 0644 }
  - secretFullName: testbed-secrets
    volumeName: rucio-cfg-server
    mountPath: /opt/rucio/etc/rucio.cfg
    subPath: server.cfg
  - secretFullName: testbed-secrets
    volumeName: rucio-cfg-alembic
    mountPath: /opt/rucio/etc/alembic.ini
    subPath: alembic.ini
  - secretFullName: testbed-secrets
    volumeName: rucio-cfg-idpsecrets
    mountPath: /opt/rucio/etc/idpsecrets.json
    subPath: idpsecrets.json

# testbed-patches is a ConfigMap now (see shared/patches/kustomization.yaml —
# converted from secretGenerator, since none of its content is sensitive),
# so it mounts via configMounts, not secretMounts. Requires rucio-server's
# templates/deployment.yaml + values.yaml to support configMounts — patched
# alongside this change; see deploy/helm-charts/rucio-server/.
configMounts:
  - configMapFullName: testbed-patches
    volumeName: fts3-patch
    mountPath: /usr/local/lib/python3.9/site-packages/rucio/transfertool/fts3.py
    subPath: rucio--fts3.py
  - configMapFullName: testbed-patches
    volumeName: oidc-patch
    mountPath: /usr/local/lib/python3.9/site-packages/rucio/core/oidc.py
    subPath: rucio--oidc.py
  - configMapFullName: testbed-patches
    volumeName: constants-patch
    mountPath: /usr/local/lib/python3.9/site-packages/rucio/common/constants.py
    subPath: rucio--constants.py
  - configMapFullName: testbed-patches
    volumeName: rse-patch
    mountPath: /usr/local/lib/python3.9/site-packages/rucio/core/rse.py
    subPath: rucio--rse.py
  - configMapFullName: testbed-patches
    volumeName: authentication-patch
    mountPath: /usr/local/lib/python3.9/site-packages/rucio/core/authentication.py
    subPath: rucio--authentication.py
  - configMapFullName: testbed-patches
    volumeName: common-patch
    mountPath: /usr/local/lib/python3.9/site-packages/rucio/web/rest/flaskapi/v1/common.py
    subPath: rucio--common.py
  # Policy package, mounted straight into site-packages rather than
  # pip-installed in postStart: postStart runs concurrently with the
  # entrypoint, so Rucio can import the package before an install finishes.
  - configMapFullName: testbed-patches
    volumeName: opa-policy-init
    mountPath: /usr/local/lib/python3.9/site-packages/rucio_opa_v5_policy/__init__.py
    subPath: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--__init__.py
  - configMapFullName: testbed-patches
    volumeName: opa-policy-client
    mountPath: /usr/local/lib/python3.9/site-packages/rucio_opa_v5_policy/opa_client.py
    subPath: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--opa_client.py
  - configMapFullName: testbed-patches
    volumeName: opa-policy-permission
    mountPath: /usr/local/lib/python3.9/site-packages/rucio_opa_v5_policy/permission.py
    subPath: rucio--rucio_opa_v5_policy--src--rucio_opa_v5_policy--permission.py
