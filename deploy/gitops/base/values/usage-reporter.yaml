fullnameOverride: usage-reporter
image:
  digest: sha256:26b4079430ec6cf90bd155126215aae5c2bb9d24a21f061ca13ba0435dc8ff31
config:
  REPORTER_DRY_RUN: "true"
  REPORTER_LOOKBACK_DAYS: "0"
  REPORTER_RUCIO_HOST: http://rucio-server
  REPORTER_RUCIO_TOKEN_URL: https://keycloak:8443/realms/rucio/protocol/openid-connect/token
  REPORTER_RUCIO_CLIENT_ID: usage-reporter
  REPORTER_RUCIO_SCOPE: "openid offline_access storage.read:/ storage.modify:/"
  # dry-run never calls ARGO; placeholders only satisfy validation
  REPORTER_ARGO_METRIC_DEFINITION_ID: dry-run
  REPORTER_ARGO_TOKEN_URL: https://keycloak:8443/realms/rucio/protocol/openid-connect/token
  REPORTER_PROJECTS: '{"RI-SCALE_ENES": {"installation_id": "dry-run", "client_id": "dry-run", "client_secret_env": "REPORTER_ENES_CLIENT_SECRET"}}'
secretEnv:
  REPORTER_RUCIO_CLIENT_SECRET: { name: testbed-secrets, key: usage-reporter-client-secret }
extraEnv:
  - name: SSL_CERT_FILE
    value: /etc/testbed-ca/tls_ca_bundle.pem
extraVolumes:
  - name: testbed-ca
    secret:
      secretName: testbed-certs
      items: [{ key: tls_ca_bundle.pem, path: tls_ca_bundle.pem }]
extraVolumeMounts:
  - { name: testbed-ca, mountPath: /etc/testbed-ca, readOnly: true }
