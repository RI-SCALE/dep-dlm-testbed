fullnameOverride: rucio-client
env:
  - name: REQUESTS_CA_BUNDLE
    value: /etc/pki/tls/certs/ca-bundle.crt
volumes:
  - name: certs
    secret:
      secretName: testbed-certs
      defaultMode: 0600
  - name: secrets
    secret:
      secretName: testbed-secrets
  - name: scripts
    configMap:
      name: testbed-scripts
      defaultMode: 0755
  - name: tests
    configMap:
      name: testbed-tests
      defaultMode: 0755
volumeMounts:
  - name: certs
    mountPath: /etc/grid-security/hostcert.pem
    subPath: hostcert.pem
    readOnly: true
  - name: certs
    mountPath: /etc/grid-security/hostkey.pem
    subPath: hostkey.pem
    readOnly: true
  - name: certs
    mountPath: /etc/grid-security/certificates/5fca1cb1.0
    subPath: rucio_ca.pem
    readOnly: true
  - name: certs
    mountPath: /etc/grid-security/certificates/rucio_ca.pem
    subPath: rucio_ca.pem
    readOnly: true
  - name: secrets
    mountPath: /opt/rucio/etc/rucio.cfg
    subPath: userpass-client.cfg
    readOnly: true
  - name: scripts
    mountPath: /scripts
    readOnly: true
  - name: tests
    mountPath: /tests
    readOnly: true
