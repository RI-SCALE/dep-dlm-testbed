apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dep-dlm-staging-gateway
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: dep-dlm-staging-gateway-ip   # matches google_compute_global_address.gateway's name (${name_prefix}-gateway-ip)
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
