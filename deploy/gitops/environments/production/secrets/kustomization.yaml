# clustersecretstore.yaml is deliberately NOT listed here — it needs
# envsubst rendering, ArgoCD/Flux reconcile straight from git with no
# render step. init-argocd.sh/init-flux.sh render and apply it directly.
#
# testbed-patches comes from ../../../../../shared/patches as a base,
# not a local secretGenerator — Kustomize's load-restrictor keeps
# generator files: sources within their own Kustomization's root, and
# shared/patches/ is outside this one's. Referencing another
# Kustomization directory via resources: has no such restriction (same
# pattern the old ../../../base/externalsecrets reference used
# successfully), so the generator lives there instead and gets pulled in
# as a base. namespace: below still applies to everything it generates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dep-dlm-production
resources:
  - testbed-certs.yaml
  - testbed-configs.yaml
  - rucio-server-cfg.yaml
  - ../../../../../shared/patches
